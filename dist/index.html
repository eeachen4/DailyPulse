r day.\n• Talk things out with Gemini Live: Brainstorm in real time or share your screen/camera to discuss exactly what you see.\n• Instead of a wall of text, you get carefully crafted responses with interleaved images, timelines, and interactive visuals.\n• Get more personalized help by connecting your favorite Google apps like Gmail, Calendar, Google Photos, YouTube, and Search.\n• Upload documents, spreadsheets, photos, videos, and more to get answers, summaries, and insights about your content.\n\nBRING YOUR CREATIVE IDEAS TO LIFE\n• Generate and edit photos with Nano Banana 2: Apply camera and lighting controls, create mockups by blending multiple images, design posters with sharp text, and effortlessly build diagrams. Then, resize as needed.\n• Turn your ideas into cinematic videos with Gemini Omni for Google AI Plus, Pro, Ultra, and Workspace users.\n• Create custom soundtracks for any moment with Lyria 3.\n\nBOOST YOUR PRODUCTIVITY\n• Research with NotebookLM: Get deeper, more relevant responses that are grounded in the sources in your notebook\n• Study help and exam prep made easy: Upload your class notes to generate custom practice quizzes and interactive visuals.\n• Turn a simple prompt into a prototype: Build web pages, games, or dashboards. You can even convert your files into a podcast-style overview to listen to while you're on the move.\n\nUNLOCK MORE WHEN YOU UPGRADE\nLevel up your Gemini app experience by upgrading to the Google AI Plus, Pro, or Ultra plans, helping you tackle more complex tasks and projects.\n\nReview the Gemini Apps Privacy Notice: g.co/gemini/privacynotice.\nNote: While Gemini is a powerful productivity partner, it does not currently support iOS device actions like setting alarms or sending SMS directly. Gemini for Business is available via qualifying Google Workspace plans.","url":"https://apps.apple.com/us/app/google-gemini/id6477489729?uo=4","source":"appstore","category":"AI","score":2118787,"rating":4.71884,"price":"Free"," iption":"Download the Google app to stay in the know about things that matter to you. Try AI Overviews, find quick answers, explore your interests, and stay up to date with Discover. The more you use the Google app, the more it’s tailored to you.\n\nFeature highlights:\n\n• Image Search: See something you like? Snap a photo and discover where to shop for it, find related images, and more. Refine your camera searches by adding words – whether you want those shoes but in ‘blue’, or want to learn how to ‘repair’ that broken bit on your bicycle.\n• Hum to Search: Can't remember the name of that song? Hum the tune and the Google app will identify it for you.\n• Discover: Stay up-to-date on topics that matter to you. Get personalized news, articles, and videos based on your interests and search history.\n• Try AI Overviews: We’re making search smarter and simpler with generative AI. Try searching things like ‘how to cut onions without crying’ or ‘how to fix a broken zipper’ and AI Overviews will find what you’re looking for in faster, easier ways.\n• Google Search Widget: Search from your home screen or lock screen with the new Google widget. Choose from 2 widgets, giving you a quick search bar in both sizes, and shortcuts to choose how you Search with Lens, Voice, and Incognito in the medium size widget.\n\nSearch what you see with Google Lens:\n\n• Use your camera to identify what you’re looking at. Identify plants and animals, translate text in real-time, find similar products to buy, and even solve math problems with step-by-step guides.\n• Translate over 100 languages on things like road signs when you travel, menus, and more by pointing your camera at text.\n• Reverse image search: Find the source, similar photos, and related information for any image.\n• Socratic app functionalities like step-by-step homework help on math, physics and word problems, and testing your knowledge with Questions and Answers are now fully supported within the Google app.\n\n\nGet personalized updates in Discover:\n\n• Stay in the know about topics that interest you.\n• Start your morning with weather and top news.\n• Get real-time updates on sports, movies, and events.\n• Know as soon as your favorite artists drop new albums.\n• Get stories about your interests and hobbies.\n• Follow interesting topics, right from Search results.\n\nSearch safely and securely:\n\n• All searches in the Google app are protected by encrypting the connection between your device and Google.\n• Privacy controls are easy to find and use. Tap your profile picture to access your menu and delete recent search history from your account with one click.\n• Search proactively filters webspam to help ensure that you see safe, high-quality results.\n\n\nLearn more about what the Google app can do for you: https://search.google/\n\nPrivacy policy: https://www.google.com/policies/privacy\n\nYour feedback helps us create products you'll love. Join a user research study here:\nhttps://goo.gl/kKQn99","url":"https://apps.apple.com/us/app/google/id284815942?uo=4","source":"appstore","category":"AI","score":4948963,"rating":4.64865,"price":"Free","developer":"Google LLC","thumbnail":"https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/78/37/44/783744ad-f353-7ce1-838c-a63579797e95/SuperG_ios26-0-0-1x_U007epad-0-0-0-1-0-0-sRGB-0-0-0-85-220.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/65/fd/cd/65fdcda8-274a-9a14-cfb3-34b8750d405f/APP_IPHONE_55-0.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/f2/70/ba/f270ba0b-daff-ed9f-352e-c613b1bd9f40/APP_IPHONE_55-1.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/c7/f5/1d/c7f51d77-cae3-8520-6997-87177c421b33/APP_IPHONE_55-2.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/d1/b9/5c/d1b95cf3-2c2f-da5f-0220-e9d5110a01e6/APP_IPHONE_55-3.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v d, for any given topic.\n- You can also ask Grok to do advanced searches for you on X, letting you dive even deeper into what’s happening and what people are saying.\n\nCreate and edit images\n- Generate striking images from simple text prompts, or upload images and ask Grok to edit them.\n- Remove objects, change the scenery, or apply any art style, like Ghibli or Anime.\n\nWith Grok as your copilot and personal AI assistant, navigating the vast expanse of knowledge becomes exciting! Tap into X’s live trends, fire off bold questions, have fun conversations with AI Companions, or use the new AI image and video generation tool Imagine to explore your boundless creativity.\n\n\nTerms of Service: https://x.ai/legal/terms-of-service\nPrivacy Policy: https://x.ai/legal/privacy-policy\n\nGrok by xAI","url":"https://apps.apple.com/us/app/grok-ai/id6670324846?uo=4","source":"appstore","category":"AI","score":1314679,"rating":4.87664,"price":"Free","developer":"X Corp.","thumbnail":"https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/e7/8b/1b/e78b1be5-a960-f6eb-0d5a-6f7c2a2158f8/AppIcon-0-0-1x_U007epad-0-0-0-1-0-0-P3-0-85-220.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/0f/2a/82/0f2a8240-786e-b221-9394-9518f271c93c/Grok__SS1__U0028App_Store_U0029.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/69/8f/1d/698f1d1b-b1e9-d497-cc6f-46bb5f2ad093/Grok__SS2__U0028App_Store_U0029.jpg/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/9c/81/f9/9c81f931-4031-4c07-a8d9-b34cfba5c694/CPP__Grok_4.5_SS2.jpg/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/a6/95/c8/a695c820-be5a-b201-5604-da14ca6be08f/Grok__SS4__U0028App_Store_U0029.jpg/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/b4/01/52/b401524c-6ab1-c355-683d-5be2a6d4ec83/Grok__SS5__U0028App_Store_U0029.jpg/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSourc alyze images, get insights from photos, and search visually. Upload any image and let Copilot help you understand what you're seeing.\n\nSmart Learning Tools Built In\n• Flashcards for effective study sessions\n• Live Learn with Mico for interactive education\n• Quiz Mode to test your knowledge\n• Educational support tailored to your pace\n\nLearn Through Listening\nDiscover Podcasts created just for you. Get complex topics explained in easy-to-understand audio formats.\n\nWork Smarter, Not Harder\n• Draft emails, presentations, and reports in seconds\n• Generate summaries of complex information\n• Translate and proofread in multiple languages\n• Create grocery lists, meal plans, and travel itineraries\n• Get writing assistance for resumes, cover letters, and reports\n\nVoice Chat Support\nTalk naturally with Copilot using voice chat. Brainstorm ideas, write content, or get quick answers completely hands-free.\n\nPERFECT FOR\n\n• Students seeking educational support and study tools\n• Professionals needing help with work tasks and productivity\n• Creative minds looking for inspiration and image generation\n• Anyone wanting a reliable AI assistant for daily life\n\nHOW COPILOT HELPS YOU\n\nGet straightforward answers to complex questions through simple conversations. Whether you're planning a trip, preparing for a presentation, or exploring new ideas, Copilot provides the support you need, when you need it. Experience AI that's designed to boost your confidence, spark creativity, and help you achieve more every day.\n\nDownload Microsoft Copilot and discover your new AI companion today.","url":"https://apps.apple.com/us/app/microsoft-copilot/id6472538445?uo=4","source":"appstore","category":"AI","score":406907,"rating":4.83886,"price":"Free","developer":"Microsoft Corporation","thumbnail":"https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/9a/5e/f3/9a5ef382-a7eb-5bf0-903f-ab49cb2dc6fd/AppIcon_Production-0-0-1x_U007epad-0-4-85-220.png/512x512bb.jpg","screenshots":[ ssaging — simple, fast, secure, and synced across all your devices. One of the top 5 most downloaded apps in the world with over 1 billion active users.\n\nFAST: Telegram is the fastest messaging app on the market, connecting people via a unique, distributed network of data centers around the globe.\n\nSYNCED: You can access your messages from all your phones, tablets and computers at once. Telegram apps are standalone, so you don’t need to keep your phone connected. Start typing on one device and finish the message from another. Never lose your data again.\n\nUNLIMITED: You can send media and files, without any limits on their type and size. Your entire chat history will require no disk space on your device, and will be securely stored in the Telegram cloud for as long as you need it. \n\nSECURE: We made it our mission to provide the best security combined with ease of use. Everything on Telegram, including chats, groups, media, etc. is encrypted using a combination of 256-bit symmetric AES encryption, 2048-bit RSA encryption, and Diffie–Hellman secure key exchange. \n\n100% FREE & OPEN: Telegram has a fully documented and free API for developers, open source apps and verifiable builds to prove the app you download is built from the exact same source code that is published. \n\nPOWERFUL: You can create group chats with up to 200,000 members, share large videos, documents of any type (.DOCX, .MP3, .ZIP, etc.) up to 2 GB each, and even set up bots for specific tasks. Telegram is the perfect tool for hosting online communities and coordinating teamwork.\n\nRELIABLE: Built to deliver your messages using as little data as possible, Telegram is the most reliable messaging system ever made. It works even on the weakest mobile connections. \n\nFUN: Telegram has powerful photo and video editing tools, animated stickers and emoji, fully customizable themes to change the appearance of your app, and an open sticker/GIF platform to cater to all your expressive needs.\n\nSIMPLE: While providing an unprecedented array of features, we take great care to keep the interface clean. Telegram is so simple you already know how to use it.\n\nPRIVATE: We take your privacy seriously and will never give any third parties access to your data. You can delete any message you ever sent or received for both sides, at any time and without a trace. Telegram will never use your data to show you ads.\n\nFor those interested in maximum privacy, Telegram offers Secret Chats. Secret Chat messages can be programmed to self-destruct automatically from both participating devices. This way you can send all types of disappearing content — messages, photos, videos, and even files. Secret Chats use End-to-End Encryption to ensure that a message can only be read by its intended recipient.\n\nWe keep expanding the boundaries of what you can do with a messaging app. Don’t wait years for older messengers to catch up with Telegram — join the revolution today.\n\nTerms of Use: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/","url":"https://apps.apple.com/us/app/telegram-messenger/id686449807?uo=4","source":"appstore","category":"AI","score":277098,"rating":4.00976,"price":"Free","developer":"Telegram FZ-LLC","thumbnail":"https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/c1/83/96/c183964f-32d7-16fe-57ab-8c66518f6625/Telegram-0-0-1x_U007epad-0-1-0-sRGB-85-220.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/c7/43/08/c7430887-1b12-f786-988f-df61b671ac4b/0_APP_IPHONE_55_0.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/0d/ac/b9/0dacb9fa-84e2-1b44-cab3-6c3b6f68a74a/1_APP_IPHONE_55_1.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/75/7e/e9/757ee96c-31a3-c34c-c9a0-cb24a784912b/2_APP_IPHONE_55_2.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/3f/32/b8/3f32b8f1-713d-3b13-26f9-7187be82ffbb/3_APP_IPHONE_55_3.png/392x696bb.png rop in a long tech review video and get the key takeaways in seconds.\n​\nTEXT EDITING TOOLS\nChatOn, powered by GPT-5, helps you write product descriptions, polish intros, and summarize articles. Also, you can craft resumes and cover letters or generate emails. Try this: request a friendly follow-up email or a professional CV and add an AI-generated graphic to make it stand out.\n​\nSOCIAL MEDIA POST CREATOR\nBuilt on GPT-5, our AI writing assistant and image generator can create content for Facebook, Instagram, LinkedIn, or X. Just ask the chatbot to write a caption for you!\n​\nMATH GURU\nBuilt on GPT-5 and Gemini 3.5, our chat AI helps you actually understand the math problem rather than just giving you the answer. Try sharing a math problem and watch the chatbot in action!\n​​\nExplore the potential of GPT-5, Gemini 3.5, Claude Sonnet 5, and Sonar to make the most of this intelligent chatbot and generator.\n​\nDownload ChatOn and start chatting in the AI chat made for real-life scenarios, from planning and decision-making to content creation, analysis, and practical daily problem-solving.​\n\nFAQ\n1. Can ChatOn create text and images in multiple languages?\nYes! The chatbot and image generator support 19+ languages and adapt responses for both writing and visuals.\n2. Which AI models is ChatOn built on?\nThis chat AI is built on GPT-5, Gemini 3.5, Claude Sonnet 5, and Sonar.\n\nUNLIMITED ACCESS TO ALL FEATURES\n- You can subscribe for unlimited access to all app’s features.\n- Subscriptions are billed automatically at the rate depending on the selected subscription plan.\n\nBy using the app, you confirm that you acknowledge and accept our Privacy Policy and Terms of Use:\nhttps://aiby.mobi/chat_ios/privacy\nhttps://aiby.mobi/chat_ios/terms\n","url":"https://apps.apple.com/us/app/chaton-ai-chat-bot-assistant/id1661308505?uo=4","source":"appstore","category":"AI","score":282486,"rating":4.7001,"price":"Free","developer":"AIBY Incorporated","thumbnail":"https://is s, analyze documents, create text, visuals, and work-ready drafts, use advanced OCR, debug code, and manage prompts in one AI workspace.\n\nWHY CHATBOX\n\nUnlike most AI chatbot apps, which lock you into a single model ecosystem, ChatBox lets you send the same prompt to multiple AI models and compare their answers side by side — without needing separate subscriptions or having to switch between apps.\n\nBest for:\n\n- Writing, editing, and brainstorming—draft emails, reports, scripts, and creative content\n- Web research—search live sources and get reports with verifiable citations\n- Document summarization—extract key clauses from contracts, summarize research papers, compare two documents\n- Work tasks—analyze files, prepare reports, and choose between AI responses\n- Everyday use—get quick answers, translations, help with travel plans, and second opinions from other AI models\n\nKEY FEATURES\n\nMULTI-MODEL AI CHATBOT\nAsk one question and get answers from GPT-5, Claude, Gemini, DeepSeek, and other AI models. Assess outputs, reasoning styles, citations, code quality, and writing tone before choosing the best response.\n\nAI WRITING ASSISTANT\nDraft articles, reports, emails, study guides, and business documents. Save tone, formatting, and structure as reusable prompts across models.\n\nWEB RESEARCH WITH CITATIONS\nChatBox searches multiple live sources simultaneously, cross-references results, and delivers a structured research report with verifiable citations. Use it for competitive analysis, academic research, market deep-dives, or any topic where a simple answer isn't enough.\n\nAI DOCUMENT ANALYZER\nUpload PDF, DOCX, XLSX, and PPTX files. Extract key clauses from contracts, summarize research papers, review spreadsheets, or compare two documents — all in one app, across any AI model.\n\nAI IMAGE GENERATOR\nConvert any text prompt into original AI-generated artwork, ready to download or share.\n\nIMAGE ANALYSIS & OCR\nExtract and interpret text from screenshots, scanned documents, receipts, and handwritten notes using OCR combined with AI vision.\n\nSPECIALIZED AI ASSISTANTS\nSwitch to a coding assistant for debugging, a writing assistant for editing tone, or a research assistant for structured analysis. \n\nFAQ\n\nQ: Who is ChatBox for?\nA: Researchers, developers, writers, analysts, marketers, and students who use AI tools regularly and want multiple models in one place — without managing separate subscriptions and apps.\n\nQ: Can I compare GPT-5, Claude, Gemini, and DeepSeek in ChatBox?\nA: Yes. ChatBox lets you send the same prompt to multiple AI models, compare their answers, and choose the best response for your task.\n\nQ: Can ChatBox summarize PDFs and documents?\nA: Yes. ChatBox can analyze PDFs, DOCX files, spreadsheets, and presentations to summarize content, extract key points, and identify differences between documents.\n\nQ: Can I use ChatBox for free?\nA: Core features are available without a subscription. Pro unlocks unlimited access to premium features and expanded model usage.\n\nQ: Can ChatBox generate text in multiple languages?\nA: Yes. ChatBox supports multilingual AI writing, translation, summarization, and everyday chat in 15+ languages.\n\nQ: Does ChatBox have an audio mode?\nA: Yes, ChatBox supports hands-free, spoken conversations with AI.\n\nPRO SUBSCRIPTION\n\nSubscribe for unlimited access to selected PRO features.\nSubscriptions renew automatically according to the selected plan.\n\nPrivacy Policy: http://florate.io/projects/chatbox/ios/privacy/ \nTerms of Use: http://florate.io/projects/chatbox/ios/terms/ ","url":"https://apps.apple.com/us/app/chatbox-ai-chatbot-assistant/id6447763703?uo=4","source":"appstore","category":"AI","score":164100,"rating":4.65012,"price":"Free","developer":"FLORATE LIMITED","thumbnail":"https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/dc/5e/23/dc5e2363-b7f0-7410-adca-a80573ddd062/AppIcon-0-0-1x_U007ephone-0-0-0-1-0-0-sRGB-85-220.png/512x512bb.jpg","screensho SCRIPTIONS?\nYes. One ChatNow subscription replaces separate plans for individual AI models. Ask different models the same question, compare answers, and pick the best one, all in one chat. Nothing to set up. Ask in your own words, by typing, talking, or snapping a photo, and get a clear answer back.\n\nKEY FEATURES\n\nWRITING & GRAMMAR\nDraft the email you've been putting off, turn messy notes into a clean report, or get a first version of any document in seconds. Summarize, rewrite, translate, fix grammar, and polish any message before you hit send.\n\nRESEARCH & SMART WEB SEARCH\nGet up-to-date answers with sources: today's news, product comparisons, and fact checks on claims you saw online. Turn articles, PDFs, and slides into quick takeaways and outlines.\n\nIMAGE & VIDEO GENERATION\nGenerate images and edit photos with Nano Banana 2 and GPT Image 2, and generate short videos with Veo 3 and Seedance 2.5. Organize everything in Creative Studio, where new creative models land right after release.\n\nCODING\nDescribe your idea in Playground and watch it become a working app or website, no coding experience needed. Generate code, debug errors, and get step-by-step explanations.\n\nVOICE MODE & VOICE TO TEXT\nAsk out loud while cooking, driving, or walking, and get clear spoken answers in real time. Or skip typing and let voice-to-text turn your words into text instantly.\n\nIMAGE & DOCUMENT ANALYSIS\nSnap a photo of a chart, a diagram, a whiteboard, or handwritten notes and get a clear explanation in seconds.\n\nWHAT USERS SAY\n\"I've tested at least 12 AI platforms for work. With four paid subscriptions for comparison, this one is the way to go.\" - Sohail R., US\n\"Works amazingly fast and has cut my work and life load in half.\" - Nienie, US\n\"At 71, learning something new is usually a non-starter. I needed research, and this app saved me HOURS.\" - Hoosier R., US\n\nWHY CHATNOW\n- Every top model in one app, not one per plan\n- New models added as they launch, nothing to chase\n- Text, images, video, research, and code in one place\n- One price instead of five subscriptions\n\nIS CHATNOW FREE?\nYes, ChatNow is free to download and you can start chatting right away. A subscription gives you full access to all models and features.\n\nIS MY DATA PRIVATE?\nYes. ChatNow follows European data protection standards. Your conversations and content stay private and secure.\n\nWHO CHATNOW IS FOR\n- PROFESSIONALS: draft reports, analyze data, and make decisions faster\n- RESEARCHERS & LEARNERS: summarize sources and understand complex topics\n- CREATORS: generate images, video, and content ideas in one place\n- ANYONE: ask in plain language and get help with everyday questions\n\nIf you want one productivity app with the top AI models for every task, ChatNow is it.\n\nDownload ChatNow for free and make AI your advantage.\n\n*Total downloads as of 2026.\n\nPrivacy Policy: https://www.iubenda.com/privacy-policy/27023519\nTerms of Use: https://www.iubenda.com/terms-and-conditions/27023519\n\nQuestions or feedback? Reach out to us at chatnow.support@tappz.com\n\nChatNow is independently developed and not affiliated, endorsed, or sponsored by OpenAI.","url":"https://apps.apple.com/us/app/ai-chat-assistant-chatnow/id1667518571?uo=4","source":"appstore","category":"AI","score":139205,"rating":4.80732,"price":"Free","developer":"Tappz GmbH","thumbnail":"https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/73/a1/cd/73a1cdc7-b14b-abfe-df29-2d7698461659/AppIcon_ChatNow-0-0-1x_U007epad-0-1-0-P3-85-220.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/4d/b7/64/4db76471-7613-bfab-1f61-8bce1428d572/New_style_screens_iPhone_6.7_EN_Screen_1.jpg/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/4c/56/b3/4c56b33f-60cf-0c88-af13-a252a5f39605/New_style_screens_iPhone_6.7_EN_Screen_2-1.jpg/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/b4/13/f9/b413f931-d le":"AI Chatbot - Nova","longDescription":"Trusted by millions of users worldwide, Nova is an all-in-one AI chatbot and assistant that helps you write, learn, and get instant answers securely and effortlessly.\n\nBuilt on the latest OpenAI GPT-5.2, OpenAI GPT-5, Google Gemini 3 Pro, Anthropic Claude Sonnet 4.5, xAI Grok and DeepSeek technologies, Nova delivers fast and reliable AI assistance, helping you stay productive, creative, and informed in one seamless experience.\n\nWhether you want to write better, learn faster, or get instant answers, Nova brings the power of advanced chatbot AI into one simple experience.\n\nWHAT IT DOES\nNova helps you handle everyday tasks with ease using a powerful AI chatbot assistant:\n • Get instant answers with an advanced AI chatbot built on OpenAI GPT-5\n • Generate images with AI\n • Search the web for real-time information\n • Write, rewrite, and improve content with an AI writer built on OpenAI GPT-5 and GPT 5.2\n • Generate ideas for social media, business, and creativity\n • Translate and communicate in 140+ languages\n • Discover personalized recommendations (books, movies, more)\n • Use voice mode for hands-free interaction\n • Work on files like Word, Excel, and more\n • Scan and solve problems instantly (documents, questions, homework)\n• Generate, explain, and debug code with AI-powered coding assistance\n• Research topics in depth and explore complex ideas\n• Compare information, analyze sources, and uncover key insights\n\nKey capabilities:\n• Image generation\n• Voice mode\n• Web search\n• AI chatbot for real-time conversations\n• AI proofreader for grammar, clarity, tone, and rewriting\n• AI coding assistant\n• Deep research and analysis\n\nFrom quick questions to complex workflows, Nova delivers fast, natural responses built on OpenAI GPT-5.2 and advanced AI models, with real-time insights and context-aware intelligence built on DeepSeek.\n\nTrusted by millions of users worldwide, Nova is a leading AI chatbot for writing, productivity, and everyday AI assistance.\n\nWHY IT’S EASY\nNova is built to be intuitive, fast, and effortless.\n• One-tap AI chat, start using the AI chatbot instantly\n • Clean, intuitive interface\n • Cross-device sync, continue your chatbot AI experience anywhere\n\nHow it works:\nAsk your question\nChoose your goal (write, learn, create)\nGet instant AI-powered results\nNo setup. No complexity. Just results with your personal AI chatbot assistant.\n\nTRUST & SECURITY\nYour data and privacy are a priority.\nNova follows modern security principles:\n• Data minimization\n• No unnecessary tracking\n• Secure processing infrastructure\n\nYour AI chatbot conversations stay private and under your control.\nNova is built with a privacy-first mindset, ensuring your interaction with the AI chatbot remains secure, reliable, and protected.\n\nPrivacy Policy: https://novaapp.ai/privacy\nTerms of Service: https://novaapp.ai/terms\nSupport: support@novaapp.ai\n\nWORKS EVERYWHERE\nNova works seamlessly across all phones and tablets.\n\nMulti-language AI support (140+ languages)\nBuilt on leading AI systems:\nOpenAI GPT-5 • OpenAI GPT-5.2  • Google Gemini 3 Pro • Anthropic Claude Sonnet 4.5 • DeepSeek\n\nWHY NOVA\n• All-in-one AI chatbot & assistant  Built on OpenAI’s GPT-5 and GPT-5.2 model\n • Fast and creative chatbot AI responses\n • Designed for everyday productivity and creativity\n • Continuous improvements with evolving AI technologies\n\nTrusted by millions of users worldwide, Nova is your all-in-one AI chatbot and assistant for work, learning, and creativity, built on OpenAI GPT-5.2, Google Gemini 3 Pro and Anthropic Claude Sonnet 4.5 \n\nDESIGNED FOR EVERYDAY AI USE\n\n• AI chat, writing, and productivity assistant with image generation, web search, and voice mode\n• For students, professionals, creators, and teams, supports Word, Excel, and more\n• Fast, simple, and powerful, with scan and solve capabilities\n\nFrom simple questions to advanced tasks, Nova makes AI accessible, useful, and powerful for everyone.","url":"https://apps.apple.com/us/app/ai-chatbot-nova/id1669007652?uo=4","source":"appstore","category":"AI","score":124421,"rating":4.63644,"price":"Free","developer":"SCALEUP YAZILIM HIZMETLERI ANONIM SIRKETI","thumbnail":"https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/4e/0c/f2/4e0cf2a1-6781-4ecd-c4d0-fc28c3c418bc/AppIcon-0-0-1x_U007emarketing-0-11-0-85-220.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/b9/06/38/b906386b-dfdd-a72b-1ab3-e9bae35ce989/6.9_en-01.jpg/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/2c/c2/98/2cc298a1-5714-d800-a6a8-95299ba05071/6.9_en-02.jpg/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/8b/78/b9/8b78b956-90fc-f0c7-7410-388c0b408271/6.9_en-03.jpg/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/2d/a8/8f/2da88f75-e010-6287-d87d-c782b5908afc/6.9_en-04.jpg/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/8a/cb/96/8acb96fa-b60e-c033-5db7-2d980afe378f/6.9_en-05.jpg/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/ad/41/83/ad4183c2-62e0-80a3-e065-2b9c59fd7df3/6.9_en-06.jpg/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/87/b1/86/87b1867b-9685-8e41-b31a-bf903f008a40/6.9_en-07.jpg/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/ff/c6/e0/ffc6e02e-d405-942c-f808-2f50d3c395aa/6.9_en-08.jpg/320x480bb.jpg"],"publishedAt":"2026-08-05T00:26:49Z","tags":["Productivity"],"stats":[{"label":"版本","value":"4.4.6"},{"label":"大小","value":"189 MB"},{"label":"最低系统","value":"15"},{"label":"内容分级","value":"9+"},{"label":"更新日期","value":"2026-08-05"},{"label":"网站","value":"App Store"}],"comments":124421},{"id":"appstore-AI-1220976145","title":"Google Assistant","longDescription":"Google Assistant helps you get everyday tasks done more easily and is thoughtfully designe r replace any element in any image \n— Preview new outfits, hairstyles, and makeup looks instantly \n— Generate images, videos, and selfies from one powerful platform \n\nHere’s how it works:\n\n• MAKE YOUR SELFIES GO VIRAL\nNew filters land in ARTA every week, inspired by what’s going viral on Instagram and TikTok. Try them on, pick your favorite, and post a selfie that’s built to get attention.\n\n• EDIT YOUR IMAGES EASILY\nSwap backgrounds, change outfits, remove objects, or sharpen details—on any image. Select what you want to adjust, and ARTA handles the rest. Works on photos you made in the app or anything from your camera roll.\n\n• TURN PHOTOS INTO PHOTOSHOOTS\nOne pic is all it takes. Generate realistic portraits, professional headshots, or full digital photoshoots with different styles, outfits, and environments. All done on your phone, zero equipment or post-production required.\n\n• BUILD LIFE-LIKE VIDEOS FROM SCRATCH \nTurn photos or a text prompt into dynamic videos with fluid, realistic motion. Powered by top-tier AI models, ARTA takes the work out of producing standout clips with Hollywood-grade quality. Epic scenes, animated moments, custom content—yours in minutes.\n\n• TRY ON STYLES, OUTFITS, AND MAKEUP \nPreview new looks on yourself—outfits, hairstyles, makeup, full aesthetics—without changing a thing in real life. Create polished, influencer-style photos for social media or personal branding effortlessly.\n\n• GENERATE ART FROM TEXT OR PHOTOS\nDescribe anything or upload a reference photo, and watch it become a high-definition AI image. Explore dozens of realistic, artistic, and creative styles to produce original visuals for any purpose. A city at dusk, cats at a tea ceremony, or a surreal BBQ on Mars—ARTA crafts it all.\n\nOne app, many ways to create. Download ARTA now. \n\nFAQ\n\nQ: Do I need design skills or special equipment? \nA:  Not at all. ARTA is built for everyone, regardless of skill level. Just bring your creativity and watch the magic happen.\n\nQ: Can I create videos? \nA: Yes. ARTA lets you generate videos using AI models like Veo 3.1, Nano Banana 2, Kling, Pixverse, Runway, and Flux 2.\n\nQ: Can I edit photos I didn’t create in ARTA? \nA: Absolutely. Import any photo from your camera roll and use ARTA’s full editing toolkit.\n\nARTA PREMIUM SUBSCRIPTION\n\n• You can subscribe to get unlimited access to certain app features.\n• You can enable a free trial to access the features included in the subscription.\n• Subscriptions are billed weekly or annually at the rate selected, depending on the subscription plan.\n\nPrivacy Policy: https://aiby.mobi/ai_art_ios/privacy \nTerms of Use: https://aiby.mobi/ai_art_ios/terms","url":"https://apps.apple.com/us/app/ai-photo-generator-arta/id1642969698?uo=4","source":"appstore","category":"AI","score":80646,"rating":4.30433,"price":"Free","developer":"AIBY Incorporated","thumbnail":"https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/b3/75/9f/b3759f67-f387-3140-f99d-866de9959b64/AppIcon-0-0-1x_U007ephone-0-1-0-85-220.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/d0/8e/09/d08e0984-579e-a3da-8201-836072776bbd/X_2__U002821_U0029.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/18/3c/80/183c80b8-e3d7-d2d7-8b0a-49a28b8b4946/X_3__U002822_U0029.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/5f/5c/d3/5f5cd325-a660-a196-272e-fe7cffbda1f2/X_4__U002811_U0029.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/d1/8d/4c/d18d4c76-6b5a-fedb-87c3-b5947d4d83b8/X_5__U002810_U0029.png/320x480bb.jpg"],"publishedAt":"2026-08-11T12:25:42Z","tags":["Photo & Video"],"stats":[{"label":"版本","value":"4.37"},{"label":"大小","value":"108 MB"},{"label":"最低系统","value":"18.0"},{"label":"内容分级","value":"12+"},{"label":"更新日期","value":"2026-08-11"},{"label":"网站","value":"App Store"}],"comments":80646},{"id":"appstore-AI-1640745955","title":"Poe – Fast AI Chat","longDescription":"Poe brings together the best AI, all in one place. It is designed for seamless conversational experiences, enhanced productivity, and creative content generation.\n\nKey Features: \n- Fast and reliable access to the latest AI models\n- Cross-device compatibility\n- State-of-the-art multimedia generation\n- Combine and compare models in a single chat\n- Advanced tools to create customized chatbots\n\nBest-in-Class AI Models, All in One Place\n\nPoe incorporates powerful AI models like OpenAI's o3 and GPT-4.5, Anthropic's Claude 3.7 Sonnet, Google's Gemini 2.0, and multimedia generators from Runway, ElevenLabs, and many more. Experience the cutting edge of AI technology, all in one app.\n\nChat with multiple bots at once\n\nCompare responses from leading AI models and seamlessly combine any bots for any use case - all within a single chat thread.\n\nAI-Powered Search Engine\n\nGet highly relevant results powered by advanced natural language processing and web search technology to find what you need faster.\n\nCreate Stunning Images and Videos Instantly\n\nTransform your ideas into eye-catching images or videos with state-of-the-art generators like FLUX1.1, Ideogram 2.0, Stable Diffusion 3.5, Veo 2, Runway, Hailuo, Dream Machine, and more. \n\nTalk to Custom Bots & AI Personalities\n\nWith access to an ever-growing ecosystem of over 1 million custom bots, you can learn a new language or any topic, chat directly with uploaded files like PDFs and images, search the web for the latest world news, or even have natural conversations with recreations of your favorite characters.\n\nBuild & Share Your Own AI Bots\n\nCreate your own custom chatbots to generate study plans, curate Spotify playlists, run Python code, and do anything else you can imagine in less than a minute. You can also add custom knowledge bases to deliver more unique experience for users. Have your AI chatbots instantly shared with millions of Poe users!\n\nPoe delivers a seamless AI experience via a user-friendly interface. Download Poe now and step into the future of AI. \n\nPoe includes both free and subscription bots. Payments for subscriptions will be charged to your Apple ID at confirmation of purchase. Your subscription will automatically renew unless canceled at least 24 hours before the end of the current period. Your account will be charged for renewal within 24 hours prior to the end of the current period. Subscriptions may be managed by the user, and auto-renew may be turned off after purchase by going to the 'Manage Subscription' page in settings. Any unused portion of a free trial period, if offered, will be forfeited when the user purchases a subscription to that publication, where applicable. The subscription will renew at the same cost.\n\nBy using Poe, you confirm that you have read, acknowledged, and agreed to our Privacy Policy and Terms of Use.\n\nPrivacy Policy: https://poe.com/privacy\n\nTerms of Service: https://poe.com/tos","url":"https://apps.apple.com/us/app/poe-fast-ai-chat/id1640745955?uo=4","source":"appstore","category":"AI","score":53871,"rating":4.71805,"price":"Free","developer":"Quora, Inc","thumbnail":"https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/14/17/cd/1417cd53-7595-c810-c14d-fd8222812ae4/AppIcon_Poe-0-0-1x_U007emarketing-0-0-0-8-0-0-85-220.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/a1/12/ac/a112ac1f-2bae-0f30-7d58-798d650900a2/0_APP_IPHONE_55_0.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/4c/b8/12/4cb812f9-4676-7c27-e55f-2caf04ae27f7/1_APP_IPHONE_55_1.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/f4/e2/f2/f4e2f214-a452-e7e8-c10e-83119acc5aeb/2_APP_IPHONE_55_2.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/5a/04/2f/5a042ff6-7ad4-80ca-071c-602124e77f5a/3_APP_IPHONE_55_3.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSourc bel":"更新日期","value":"2026-08-05"},{"label":"网站","value":"App Store"}],"comments":25872},{"id":"googleplay-AI-com.google.android.apps.accessibility.voiceaccess","title":"Voice Access","description":"Provides accessibility by voice for hands-free mobile computing.","longDescription":"Voice Access helps anyone who has difficulty manipulating a touch screen (e.g. due to paralysis, tremor, or temporary injury) use their Android device by voice.\n\nVoice Access provides many voice commands for:\n- Basic navigation (e.g. \"go back\", \"go home\", \"open Gmail\")\n- Controlling the current screen (e.g. \"tap next\", \"scroll down\")\n- Text editing and dictation (e.g. \"type hello\", \"replace coffee with tea\")\n\nYou can also say \"Help\" any time to see a short list of commands.\n\nVoice Access includes a tutorial which introduces the most common voice commands (starting Voice Access, tapping, scrolling, basic text editing, and getting help).\n\nYou can use the Google Assistant to start Voice Access by saying \"Hey Google, Voice Access\". To do this, you’ll need to enable \"Hey Google\" detection. You can also tap either the Voice Access notification or a blue Voice Access button and start talking.\n\nTo pause Voice Access temporarily, just say \"stop listening\". To disable Voice Access completely, go to Settings > Accessibility > Voice Access and turn off the switch.\n\nFor additional support, see Voice Access help.\n\nThis app uses the AccessibilityService API to help users with motor impairments. It uses the API to collect information about the controls on the screen and activate them based on the user’s spoken instructions.","url":"https://play.google.com/store/apps/details?id=com.google.android.apps.accessibility.voiceaccess&hl=en&gl=us","source":"googleplay","category":"AI","rank":17,"score":1724922617,"rating":3.8784356,"price":"Free","developer":"Google LLC","comments":4045,"thumbnail":"https://play-lh.googleusercontent.com/QuX3iglvEMZEyDVWhU7ZnAe20ICoewciOZ3OR3 rprise-level development.\n\nRESEARCH AND DATA INSIGHTS \n\nGo deeper on the questions that matter. Claude searches the web, compiles findings with accurate citations, and surfaces what's actually useful. Connect Google Drive, Gmail, and Calendar to bring your own context into the conversation. Whether you're conducting business analysis, building reports, or exploring new ideas, Claude thinks through problems with you, from the first question to the one you didn’t know to ask.\n\nVISUAL ANALYSIS \n\nUpload any photo, PDF, or screenshot for instant analysis. Claude extracts text, interprets charts and graphs, evaluates UI layouts and technical diagrams, and explains what it sees. Get thoughtful feedback on app designs and data visualizations. Generate SVG code for graphics and illustrations, right from your phone.\n\nNO TYPING NEEDED \n\nThink out loud. Use Claude as your AI voice assistant to have conversations in multiple languages—perfect for brainstorming sessions or working through ideas on the go.\n\nEXPAND WHAT YOU CAN DO \n\nTake on projects outside your usual expertise. Whether you're learning something new, navigating unfamiliar territory, or need a thoughtful second opinion, Claude helps you take on the hard questions you otherwise don’t have time or bandwidth for.\n\nClaude helps you: \n▶ Develop and refine content with AI writing\n▶ Work through meeting notes to surface key insights\n▶ Build reports and marketing content iteratively\n▶ Explore complex math problems with step-by-step reasoning\n▶ Plan projects, structure ideas, and build flowcharts together\n▶ Analyze PDFs, screenshots, and visual content for deeper patterns\n▶ Think through problems hands-free with voice dictation\n\nTRUSTED AND RELIABLE \n\nClaude is designed to be reliable, accurate, and collaborative. It’s built by Anthropic, an AI research company dedicated to building safe and dependable AI tools. Powered by Claude Fable, Opus, Sonnet, and Haiku, it brings advanced reasoning, creativity, and problem-solving capabilities to your most important challenges.\n\nTRY CLAUDE FOR FREE\n\nJoin millions of users who trust Claude for their work on the problems that matter. Whether you're coding, writing, researching, or tackling business challenges, Claude helps you think deeper and reach further.\n\nTerms of Service: https://www.anthropic.com/legal/consumer-terms \nPrivacy Policy: https://www.anthropic.com/legal/privacy \n© 2026 Anthropic, PBC","url":"https://play.google.com/store/apps/details?id=com.anthropic.claude&hl=en&gl=us","source":"googleplay","category":"AI","rank":7,"score":56109147,"rating":4.4813337,"price":"Free","developer":"Anthropic PBC","comments":13404,"thumbnail":"https://play-lh.googleusercontent.com/YeFCFSW5LkBVdsEAL_fjzxDxTbhKz31j1uZUfDbSaCeM0t4Bi3SqyHTWzWsUsZnbwjofXhYajitG_gr2_B2xil8","screenshots":["https://play-lh.googleusercontent.com/byqUyhqKBbyxIOn2pdTV48WLQ06wtd1hwZAR-I4UQWHdYrzBizm9zOqKPd3v4hKCVD8fc4084BPvOR5CGsZsDw","https://play-lh.googleusercontent.com/gqK_ZpnET56oIb3vaPxEyosVOKd9cwo4rPxlAS3GPma4jB5d1jAyZiK4Zn3ho1c79vMClGJRTIymNpbghN6R","https://play-lh.googleusercontent.com/BedGMvecHJXgl41oCTAX5T5bV_4klYK5ibe6WkaJYYx6iQaFtNFOnYUVHM5CNTG8GacHOPxLc-kWPiwPzoq4","https://play-lh.googleusercontent.com/2bi_K4Hl_nL8-ndiddJQ1arWGNq1vBuom0gDQOVHNuNyh0BGoRaeLAlrQkqS-BXpI1tNpqMy_KhO_0xl0IQFlw","https://play-lh.googleusercontent.com/VohC9GAQz5y9PxyKF0-hV-5goiFIpBkiAut4vVF2r7nKXwywosYJl6oJ-TftqCqNk9fEXgrhhWz4f37IZ9ys","https://play-lh.googleusercontent.com/YOReWSWfJDPm9BOkKD38U_53Dftc961wZD8kwQn31AoyplS4YnxtIXUrLgVWuZg16LHCWvVLbFcWJZnQU6hJsg","https://play-lh.googleusercontent.com/qoYbW0ns_g7oT4mfvxe1BZswHD7wYelI--Tw-4pP9IHgamhCuXznGn49junqDIs8NeA5CVStx331baOZMMzBKA","https://play-lh.googleusercontent.com/2zrZ7kSKpp27hcUPsah_z_6Bqh3bV4ICoBMPB2KhgCNohfnCjTilDhINkssHIyzqPyLPS6NgGjwO4z2V5KQtnlA"],"publishedAt":"Jul 11, 2024","tags":["Productivity"],"stats":[{"label":"版本","value":"1.260813.10"},{"label":"安装量","value":"50,000,000+"},{"l nt, engineered to streamline your personal and professional tasks. ChatOn brings together the most advanced AI assistant technology in one smart, intuitive app.\n\nChatOn is the ultimate digital assistant for everyone, from bloggers to business leaders. Need to draft emails, create pics, or generate ideas? Turn to our intelligent chatbot built on GPT-5, Gemini 2.5 Pro, GPT-4o, Sonar, Claude 4.5, and DeepSeek-R1 for help.\n\nWith nearly 100M downloads and 96M+ users worldwide, this smart software solution speeds up content creation by up to 30% thanks to its collection of 100+ AI prompts.\n\nHOW IT WORKS\nStep 1. Type a request for your AI assistant or pick from our prompts\nStep 2. ChatOn will process your request using AI tools\nStep 3. Get your answer via the AI chatbot interface as text, image, or summary\n\nWITH CHATON AI, YOU CAN\n• Write, edit, and proofread your text\n• Get quick answers and explanations\n• Brainstorm ideas\n• Turn ideas into visuals with our image generator\n• Plan daily tasks, trips, schedules, etc.\n\nKEY FEATURES\n\nIMAGE & VIDEO GENERATOR\nCreate high-quality AI images and videos from photos within the chat. Refine details, swap backgrounds, enhance quality, and adapt visuals in seconds.\n\nIMAGE-TO-TEXT CONVERTER\nChatOn AI generator can extract text from your photos and add it directly into the chat AI. This means you can scan a book page and turn its text into editable data.\n\nAI WRITING ASSISTANT\nChatOn, built on GPT-5, GPT-4o, and GPT-4, gives you a versatile AI writing chatbot and generator for any project (emails, speeches, social posts, etc.) Pick the length and tone of the chatbot’s answers and get ideas for follow-up questions to keep your chat going.\n\nWEB ANALYZER\nOur chatbot AI uses GPT-5, GPT-4o, and GPT-4 to search the web in real time. ChatOn finds up-to-date links, making your assistant reliable for checking facts or making smart decisions.\n\nDOC MASTER\nSummarize, rewrite, translate, and ask questions about any doc with our chatbot AI. Just upload a PDF and get a quick summary to help you study or work.\n\nYOUTUBE PRO\nShare a YouTube link for the AI chatbot to summarize, translate, or answer questions about its content. You can drop in a long tech review video and get the key takeaways in seconds.\n\nADVANCED TEXT EDITOR\nWith ChatOn, built on GPT-5, GPT-4o, and GPT-4, you can sharpen intros, make product descriptions more engaging, or break down long articles into simple highlights.\n\nSOCIAL MEDIA POST CREATOR\nBuilt on GPT-5, GPT-4o, and GPT-4, our AI writing assistant and image generator can create content for Facebook, Instagram, LinkedIn, or X. Just ask the chatbot to write a caption for you!\n\nMATH GURU\nBuilt on GPT-5, GPT-4o, and GPT-4, our chat AI helps you actually understand the math problem rather than just giving you the answer. Try sharing a math problem and watch the chatbot in action!\n\nCV & COVER LETTER BUILDER\nCraft professional resumes and cover letters, enhanced with visuals from the AI image generator. Ask the assistant to create a modern layout with an AI-designed header.\n\nEMAIL GENERATOR\nBuilt on GPT-5, GPT-4o, and GPT-4, ChatOn can write any email you need. Try this: request a friendly follow-up email and add an AI-generated graphic to make it stand out.\n\nExplore the potential of GPT-5, Gemini 2.5 Pro, GPT-4o, Sonar, Claude 4.5, and DeepSeek-R1 to make the most of this intelligent chatbot and generator.\n\nDownload ChatOn and start chatting in the AI chat made for real-life scenarios, from planning and decision-making to content creation, analysis, and practical daily problem-solving.\n\nFAQ\n1. Can ChatOn create text and images in multiple languages?\nYes! The chatbot and image generator support 19+ languages and adapt responses for both writing and visuals.\n2. Which AI models is ChatOn built on?\nThis chat AI is built on GPT-5, Gemini 2.5 Pro, GPT-4o, Sonar, Claude 4.5, and DeepSeek-R1.","url":"https://play.google.com/store/apps/details?id al-time trends, cultural nuances, and evolving language, enabling timely, relevant, and socially aware replies.\n\nDeepseek – technical and coding expertise\n\nDeepseek enhances the AI Chatbot’s technical capabilities, specializing in programming, debugging, and algorithm explanations. Developers benefit from clear and precise assistance, making coding support efficient and reliable.\n\nClaude – ethical and responsible AI\n\nAnthropic’s Claude model helps maintain ethical standards and responsible AI chat. Claude moderates conversations to avoid bias, misinformation, or harmful content. This model ensures AI chat remains respectful, safe, and trustworthy, fostering a balanced experience.\n\nQwen – multilingual and cultural fluency\n\nPowered by Alibaba, Qwen extends the AI Chatbot’s multilingual communication and cultural sensitivity. It comprehends language nuances, idioms, and cultural references across languages for smooth, globally aware conversations.\n\nFlux & DALL·E – AI-powered image generation\n\nThe AI Chatbot also features AI image generation with Flux and DALL·E. DALL·E creates detailed and imaginative images from text prompts, while Flux provides enhanced artistic control and styling options.\n\nHarnessing the combined power of Gemini, Grok, Deepseek, Claude, Qwen, Flux, and DALL·E — Built on GPT-5, Gemini, Grok, Deepseek, Qwen, Claude & AI Image Generator — Genie offers a complete AI assistant experience. Whether you are chatting, coding, analyzing, or creating images, Genie uses these models to deliver intelligent, fast, and versatile support.\n\nDo not enter personal information. May generate offensive or dangerous content. Not liable for generated responses.\n\nPrivacy: https://appnation.co/privacy\nTerms: https://appnation.co/terms","url":"https://play.google.com/store/apps/details?id=co.appnation.geniechat&hl=en&gl=us","source":"googleplay","category":"AI","rank":19,"score":15810157,"rating":4.5004168,"price":"Free","developer":"APPNATION AS","com \nWith Jimmy and its cutting-edge artificial intelligence built on Gemini, your imagination knows no bounds. Explore a world of meticulously curated AI prompts designed to spark your creativity and fuel your curiosity. Whether you're a writer seeking inspiration, a language enthusiast eager to practice, or simply looking to learn something new, Jimmy is your ideal companion.\n\nWhat Makes Jimmy Unique:\nJimmy isn’t just another virtual assistant. Developed on state-of-the-art AI, it offers a unique collection of prompts designed to stimulate creativity, boost productivity, and foster meaningful connections. Jimmy helps you write inspiring stories and heartfelt poems, brainstorm innovative ideas, and improve your language skills. Jimmy helps you express yourself freely and effortlessly.\n\nUser-Friendly Experience: The AI interface adapts to your preferences, delivering personalized recommendations that resonate with you on a deeper level.\n\nKey Features:\n\n• Search for Everything: Do you have a question or need advice? Enter your question, and advanced AI will provide instant answers and solutions for everything from everyday problems to complex tasks.\n\n• Developed on Gemini AI: Experience the latest models including Gemini 3.1 Pro, Gemini 3.6 Flash, and Gemini 3.5 Flash-Lite for fast, accurate, and intelligent responses.\n\n• Web Search with links to Sources: Get the most up-to-date answers with integrated web search and access to relevant source links. Whether it's the latest tech, fashion trends, or health tips, and get all the current info you need.\n\n• Chat with AI: Engage in dynamic conversations with our AI assistant. Ask questions, share ideas, or brainstorm with your intelligent virtual companion—your personal assistant, always at your fingertips.\n\n• Snap & Solve: Scan problems, analyze instantly, and get accurate answers - super useful for math problems.\n\n• Advanced Voice Mode: Talk naturally with enhanced, human-like voices. Have real-time conver et more.\n\nBlink Outdoor 4 is our fourth-generation wireless smart security camera that helps you protect your home inside and out right from your phone. Outdoor 4 runs for up to two years on a single set of AA lithium batteries and can be used inside and out — rain or shine — with features like two-way audio, enhanced motion detection, and more. \n\nBlink Outdoor 4 Floodlight Camera illuminated your home with 700 lumens of motion-triggered LED lighting, HD live view, wire-free install, and real-time alerts for around-the-clock peace of mind. Be alerted to motion faster from your smartphone with dual-zone, enhanced motion detection, and Receive alerts when a person is detected with embedded computer vision (CV) as part of an optional Blink Subscription Plan (sold separately).\n\nBlink Mini 2 is our second-generation plug-in smart security camera that helps you stay connected to what’s happening in your home, right from your smartphone. Use the motion-activated built-in spotlight to always know who’s there, day or night. Plus, plug in Mini 2 outside your home with the Blink Weather Resistant Power Adapter (sold separately or as part of a bundle) and mount with the included kit.\n\nBlink Mini is mighty — but tiny — which means you can plug it in anywhere inside your home. Hear, see, and speak right from the Blink Home Monitor app on your phone and get alerts whenever motion is detected.\n\nBlink Mini Pan-Tilt lets you see what's happening inside any room from corner to corner with 360° coverage from your smartphone, tablet, or compatible Alexa device. Pan left and right and tilt up and down from the Blink app to see more of your home with HD day and infrared night view. \n\nBlink Wired Floodlight Camera helps protect your home day or night with with 2600 lumens of LED lighting, enhanced motion detection, and a built-in security siren. Get alerted to movement with dual-zone, customizable motion detection and sound the security siren when needed. Set motion zones in th  must be with you. If they are not, you should apply online at: https://www.gov.uk/electronic-travel-authorisation.\n\nAfter you apply\n\nYou’ll get a decision by email from UK Visas and Immigration (UKVI), usually within a day. Allow up to 3 working days (Monday to Friday) to get a decision, but it may arrive much sooner.\n\nThe email will contain your 16 digit ETA reference number.\n\nYou must wait until you get an email confirming you have an ETA before you travel to the UK.\n\nIf you have not received a decision after 3 working days, check your spam or junk email folder before contacting UKVI.\n\nYou may get decisions at different times to other people you applied for.\n\nYour ETA will be linked to the passport you applied with. You only need to show your passport when you travel to the UK.\n\n\nPrivacy and security\n\nThe app is safe and secure. No information is stored on the app or your phone after you close it. You can delete the app after you have completed your application.\n\nFor information on staying safe online visit the UK Cyber Aware website: https://www.ncsc.gov.uk/cyberaware/home\n\nAccessibility\nYou can read our accessibility statement at: https://confirm-your-identity.homeoffice.gov.uk/register/eta-app-accessibility\n\n","url":"https://apps.apple.com/us/app/uk-eta/id6444912481?uo=4","source":"appstore","category":"工具","rank":26,"score":1513,"rating":3.24256,"price":"Free","developer":"Home Office","thumbnail":"https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/b6/e9/aa/b6e9aa9b-3a5a-75fb-cd15-1e4350a0593d/AppIcon-1x_U007emarketing-0-6-0-85-220-0.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource122/v4/ac/2b/e3/ac2be338-ed1a-3c6b-e2cf-35623c42f142/59e31942-ee65-4583-b09b-47df27153899_1.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource122/v4/11/66/e1/1166e1fa-c899-9235-c31a-87d75d249876/6e70ab7b-e101-4d1f-b4cb-47fa9636cf3b_2.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thum oper Tools"],"stats":[{"label":"版本","value":"1.4.0"},{"label":"大小","value":"105 MB"},{"label":"最低系统","value":"16.4"},{"label":"内容分级","value":"17+"},{"label":"更新日期","value":"2026-07-19"},{"label":"网站","value":"App Store"}],"comments":47},{"id":"appstore-代码-1442620678","title":"Surge 5","longDescription":"Surge is an advanced network toolbox and proxy utility. It is designed for developers and therefore requires professional knowledge to use.\n\nThese four capabilities form the core workflow of Surge:\n\n· Takeover: Take over the network connections sent by the device. Surge supports both proxy service and virtual NIC takeover, capturing HTTP, HTTPS, TCP, and UDP traffic from any app — even those ignoring proxy settings. All features work on the cellular network.\n· Processing: Modify the requests and responses that have been taken over: URL rewrite, header and body rewrite, local file mapping, custom DNS answers, and JavaScript-based modification.\n· Forwarding: Forward requests to proxy servers, either globally or driven by a flexible rule system. Policy groups select the best server automatically by latency, availability, or learned connection quality.\n· Intercept: Record and inspect requests and responses, including headers and bodies, and decrypt HTTPS traffic with MITM.\n\nHighlighted Features\n\n· Proxy protocols: HTTP/HTTPS, SOCKS5, SOCKS5-TLS, HTTP2 CONNECT, TrustTunnel, Shadowsocks, Snell, Trojan, Hysteria 2, AnyTLS, and SSH, with UDP relay support.\n· Used as a WireGuard or Tailscale client, converting the L3 VPN into a proxy policy.\n· Rules based on domain match/suffix/keyword/wildcard, CIDR IP range, GeoIP, ASN, protocol, port, and logical combinations; reusable rule sets hosted locally or remotely.\n· Policy groups: manual selection, automatic latency testing, fallback, load balancing, and the self-learning Smart group.\n· Complete DNS suite: DNS-over-HTTPS, DNS-over-HTTP/3, DNS-over-QUIC, DNS-over-TLS, and concurrent queries for the fastest answer.\n· Local DNS mapping (equivalent to /etc/hosts) with wildcards, aliases, and per-domain DNS servers. Switch your app between production and development environments without changing any code.\n· Decrypt HTTPS traffic with Man-in-the-Middle and a built-in CA certificate generator.\n· Record and display HTTP requests and responses with JSON, text, image, and video viewers for the captured body; album mode for the request list; pre-filter for capturing.\n· Raw L3 packet capture.\n· Scripting: extend Surge with JavaScript — modify requests and responses, write custom rules, customize DNS answers, and run scheduled tasks.\n· Block unwanted requests by rules with high-performance pre-matching.\n· Measure traffic usage and network speed on Wi-Fi, cellular, and proxy connections.\n· Remote Dashboard: observe and debug traffic in real time from a Mac via Wi-Fi or USB, including cellular traffic.\n· Surge Ponte: access your home or office network remotely via your own devices, with no third-party service involved.\n· HTTPS proxy protocol supports client-side TLS certificate validation.\n· Safari extension to add rules; widgets and Information Panel for quick control.\n· Sync profiles across devices with iCloud Drive or Dropbox.\n· Full IPv6 support, TLS 1.3, HTTP/2, and QUIC.\n· High performance and industrial-grade stability, suitable for intensive use.\n\nSurge does not provide any proxy or VPN service; you need to configure your own servers.\n\nYou may read the online manual for more information: https://nssurge.com/support\n\nTerms and Conditions: https://nssurge.com/legal/terms\nPrivacy Policy: https://nssurge.com/legal/privacy","url":"https://apps.apple.com/us/app/surge-5/id1442620678?uo=4","source":"appstore","category":"代码","rank":23,"score":988,"rating":4.10324,"price":"Free","developer":"Surge Networks Inc.","thumbnail":"https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/d8/84/89/d88489ff-9cbd-eeeb-a8ff-df27d345b3c3/AppIconS-0-0-1x_U007epad-0-1-0-85-220.png/512x512 kchain\n● Crypto\n● Bitcoin\n● NFTs\n\nAnd more technical topics such as:\n● Security\n● Functional Programming\n● Git\n● Regex\n● Docker\n● MongoDB\n● Linux\n\nOver 1.5 million people have used Enki to build and improve their coding, data and other critical skills.\n\nWhat the media say about us:\n\n\"The exercises on Enki are focused on making software developers more productive.\"\n● Forbes\n\n\"Ever imagined yourself as a JavaScript whizz, or pulling no punches with Python? Want to get a handle on SQL, or let yourself loose with Linux? Then let Enki be your coding coach, setting you daily workouts that tackle the intricacies of coding languages in bite-sized steps.\"\n● Apple's App Store; featured as app of the day in 100+ countries\n\n\"Compared to free reading options this is structured, personalized content. Enki creates a 5-minute \"workout\" for software developers to learn important concepts in their spare time.\"\n● TechCrunch\n\n\"The app supports everyone from beginners to more experienced coders. You can almost think of Enki the same way you would an exercise app. It provides you with daily workouts, but here you’re leveling up your coding skills instead of burning fat and building muscle.\"\n● MakeUseOf\n\n\"Enki has one of the most accessible and attractive interfaces out there\"\n● Career Karma\n\nTo learn more, visit www.enki.com","url":"https://play.google.com/store/apps/details?id=com.enki.insights&hl=en&gl=us","source":"googleplay","category":"代码","rank":22,"score":2504965,"rating":4.5785537,"price":"Free","developer":"enki.com","comments":1631,"thumbnail":"https://play-lh.googleusercontent.com/qMXHFP_W5Spb2PTKkGW9KfCSf2JSka1s4gwwg30f_PZIhHfz6KC7Qg9N3-8dHdpqBlkkJ29WCsIC7l_wc3I3cD0","screenshots":["https://play-lh.googleusercontent.com/_vq_Eh32lUzp2QPn3dKrUTDMpghUOOLj_Am1YGXxoJUfFS8BXVXtG2HzE5nmL4knmf9B0YfcroI0JThyCAfkhA","https://play-lh.googleusercontent.com/3pyyZcjVn7a9neI_5ExEmvyeRk5r2yUAL-OdUZo8Mpti01aeehEtKsnfX5jgqoWRwy1X8thmvDXp2RyBw_F8etM tion. Whether you're conducting business analysis, building reports, or exploring new ideas, Claude thinks through problems with you, from the first question to the one you didn’t know to ask.\n\nVISUAL ANALYSIS \n\nUpload any photo, PDF, or screenshot for instant analysis. Claude extracts text, interprets charts and graphs, evaluates UI layouts and technical diagrams, and explains what it sees. Get thoughtful feedback on app designs and data visualizations. Generate SVG code for graphics and illustrations, right from your phone.\n\nNO TYPING NEEDED \n\nThink out loud. Use Claude as your AI voice assistant to have conversations in multiple languages—perfect for brainstorming sessions or working through ideas on the go.\n\nEXPAND WHAT YOU CAN DO \n\nTake on projects outside your usual expertise. Whether you're learning something new, navigating unfamiliar territory, or need a thoughtful second opinion, Claude helps you take on the hard questions you otherwise don’t have time or bandwidth for.\n\nClaude helps you: \n▶ Develop and refine content with AI writing\n▶ Work through meeting notes to surface key insights\n▶ Build reports and marketing content iteratively\n▶ Explore complex math problems with step-by-step reasoning\n▶ Plan projects, structure ideas, and build flowcharts together\n▶ Analyze PDFs, screenshots, and visual content for deeper patterns\n▶ Think through problems hands-free with voice dictation\n\nTRUSTED AND RELIABLE \n\nClaude is designed to be reliable, accurate, and collaborative. It’s built by Anthropic, an AI research company dedicated to building safe and dependable AI tools. Powered by Claude Fable, Opus, Sonnet, and Haiku, it brings advanced reasoning, creativity, and problem-solving capabilities to your most important challenges.\n\nTRY CLAUDE FOR FREE\n\nJoin millions of users who trust Claude for their work on the problems that matter. Whether you're coding, writing, researching, or tackling business challenges, Claude helps you think deeper and reach further.\n\nTerms of Service: https://www.anthropic.com/legal/consumer-terms \nPrivacy Policy: https://www.anthropic.com/legal/privacy","url":"https://apps.apple.com/us/app/claude-by-anthropic/id6473753684?uo=4","source":"appstore","category":"Agent","score":231431,"rating":4.71818,"price":"Free","developer":"Anthropic PBC","thumbnail":"https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/1c/09/42/1c09427f-e3f5-4b9a-4e64-03ca2689d2b6/AppIcon-0-0-1x_U007epad-0-1-85-220.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/89/48/13/89481309-850d-067c-3f0e-a70c919ef625/Useful_answers.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/48/7f/d6/487fd65e-fd2b-350e-9f15-b5e0959c1e61/Voice_Mode.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/b5/d7/e4/b5d7e409-11b6-8e44-f5de-f1ad23f90e37/Tools.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/70/a0/f4/70a0f4b1-3bfa-c74d-5a1a-b0691e6284cc/Build_App.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/1e/46/aa/1e46aa66-bbd8-9bb8-195a-8885bc993d4b/Ideas_-__Files.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/ec/6f/b6/ec6fb6a7-bae8-3684-9c6a-3e98a987736e/Dispatch.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/2b/3c/62/2b3c62ad-6ff7-f237-331a-67d14ecfde7d/Code_Review.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/ba/7f/91/ba7f911b-b428-3f6b-df07-fc724aa5dd83/Write.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/07/98/4f/07984f09-c0f7-d680-ff14-9aa6dd8d547a/End_Card.png/392x696bb.png"],"publishedAt":"2026-08-13T16:56:49Z","tags":["Productivity"],"stats":[{"label":"版本","value":"1.260813.0"},{"label":"大小","value":"199 MB"},{"label":"最低系统","value":"18.0"},{"label":"内容分级","value":"17+"},{"label":"更新日期","value":"2026-08-13"},{"label":"网站 mith makes every workflow quicker and more efficient.  \n\nMARKETING ASSISTANT\nThis AI Chatbot helps you generate ad copy, research insights, SEO keywords, product names, and brand taglines. You can also create engaging social posts, captions, and retweets for Facebook, X, and Instagram with a smart AI caption generator.  \n\nREAL-TIME SEARCH\nPowered by GPT-5.6 Sol, Claude Sonnet 5, Grok-4.5, Gemini Flash 3.5, and DeepSeek V4, this feature lets you instantly access the latest information online. From breaking news to niche queries, Chat Smith keeps you updated and informed.\n\nAI HOMEWORK HELPER\nPrep for quizzes, get homework answers, and generate notes with a study assistant. Built on GPT-5.6 Sol, Gemini Flash 3.5, and Claude Sonnet 5, Chat Smith also provides a powerful AI Math Solver to help students tackle math problems with step-by-step explanations.\n\nTEXT & VIDEO SUMMARIZER\nSummarize PDFs, documents, notes, and YouTube videos instantly. Translate, rewrite, and extract key insights in seconds.\n\nAI TRANSLATOR & LANGUAGE PRACTICE\nTranslate any languages using powerful multilingual capabilities. Perfect for travel, learning, and everyday conversations.\n\nIMAGE ANALYZER\nUpload any photo for instant image analysis. Identify objects, places, animals, or text with clear explanations.  \n\nTEXT TO SPEECH\nConvert text into human-like audio with advanced AI voice technology.  \n\nAI KEYBOARD\nType faster with AI-powered grammar fixes, predictive typing, auto replies, and autocorrect.\n\nGRAMMAR & SPELLING CHECKER\nFix grammar, spelling, and punctuation with AI proofreading tools.  \n\nRESUME & CV BUILDER\nGenerate resume, cover letter, LinkedIn optimization, and interview questions with a built-in AI resume checker.  \n\nMOBILE-WEB SYNC\nUse Chat Smith on mobile and web with seamless cross-device sync.  \n\nYou can subscribe to our auto-renewing plans: weekly ($6.99), monthly ($9.99), or yearly ($49.99). After the free trial, payment is charged to your iTunes n is a productivity app where you can write, plan, and organize your notes, projects, tasks and more. Ask Notion AI about project updates, upcoming tasks, and suggestions for a more streamlined workflow.\n\nSimplify writing notes, project and task management, and collaboration. Whether for personal, student or professional use, Notion scales to meet your individual needs with customization tools for everyone.\n\nNEW features:\n• AI Meeting Notes: Perfect meeting memory. Your notetaker catches every detail and delivers actionable summaries, right where you work.\n• Maps View: Turn databases into interactive maps. Use the new Place property to pin restaurants, trips, offices, clients, and more.\n\nFREE FOR PERSONAL USE\nIndividuals manage day-to-day tasks, notes, and personal organization.\n• Create as many notes, docs, and content as you want.\n• Use one of thousands of templates to get started.\n\nFREE TO TRY WITH YOUR TEAM\nTeams run on Notion every day, from next-generation startups to established enterprises.\n• Import Google Docs, PDFs, and other content types easily to get started\n• Write and organize meeting notes, or transcribe with AI.\n• Collaboration and team work at your fingertips, in one connected workspace.\n• Connect tools like Figma, Slack, and GitHub to Notion.\n\nFREE FOR STUDENTS\nStudents organize notes, assignments, and study plans in one place.\n• Your study planner, class notes, to do lists and more, your way. Loved by millions of students worldwide.\n• Get organized for your best school year yet with beautiful, customizable templates created by students, for students.\n\nNOTES & DOCS\nCommunication is made efficient with Notion's flexible building blocks.\n• Create docs with beautiful templates, images, to-dos, and 50+ more content types.\n• Meeting notes, projects, design systems, pitch decks, and more.\n• Find exactly what you need using Search with powerful filters to find content across your workspace.\n\nTASKS & PROJECTS\nCatch all details big and small in any workflow.\n• Workflow manager: Create your own priority labels, status tags, and automations to choose the exact info you want to track.\n• Capture every detail in a table. Break projects into manageable tasks to get the work done.\n\nAI\nOne tool that does it all - search, generate, analyze, and chat - right inside Notion.\n• Create notes. Transcribe meeting notes with AI.\n• Turn databases into interactive maps. Use the new Place property to pin restaurants, trips, offices, clients, and more.\n• Write better. Use Notion AI to help write and brainstorm.\n• Get answers. Ask Notion AI questions about all your content and get answers in seconds.\n• Autofill tables. Notion AI turns overwhelming data into clear, actionable information  — automatically.\n\nSYNCS WITH BROWSER, MAC, AND WINDOWS APPS.\n• Pick up on mobile where you left off on desktop.\n\nMORE PRODUCTIVITY. FEWER TOOLS.\n• Track to-dos, write notes, create docs, and manage projects in one connected workspace.\n\nTHINK IT. MAKE IT.","url":"https://apps.apple.com/us/app/notion-notes-tasks-ai/id1232780281?uo=4","source":"appstore","category":"Agent","score":89814,"rating":4.77696,"price":"Free","developer":"Notion Labs, Incorporated","thumbnail":"https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/76/97/e3/7697e332-7885-3267-2532-45f529da9994/AppIconProd-0-0-1x_U007epad-0-0-0-1-0-0-P3-85-220.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/94/dd/d8/94ddd889-f9f6-f58d-c4f1-6e59650341fa/NotionLabs_Notion_iOS-6.9_US_Screenshots_250924_01.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/08/1d/dd/081ddd0a-7a36-1a61-5a4b-6f8b74d626db/NotionLabs_Notion_iOS-6.9_US_Screenshots_250924_02.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/36/31/93/36319340-4217-6136-84f5-4a1430d97daf/NotionLabs_Notion_iOS-6.9_US_Screenshots_250924_03.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/th anvas.\n- Transform simple text prompts into high-quality images and complete video\nstories.\n\nSMARTER WIDE RESEARCH\n- Powered by the Manus 1.6 Max architecture, conduct deep, accurate, and comprehensive web research.\n- Multiple sub-agents work in parallel to synthesize findings and draft\ndetailed reports automatically.\n\nFREE & UNLIMITED CHAT\n- Ask any question and get instant, accurate answers.\n- One-click upgrade to Agent Mode for complex, multi-step execution.\n\nTHE MANUS DIFFERENCE\n- Asynchronous Cloud Execution: Close the app. Manus keeps working. Get\nnotified when done.\n- Autonomous Task Decomposition: Complex requests are broken into a to-do\nlist and executed step by step.\n- Always in Control: Stop, edit, or redirect your task at any time.\n\nTasks that used to take 20 hours can now be done in 1. Download Manus and\nput your work on autopilot.\n\nPrivacy Policy: https://manus.im/privacy\nTerms of Use: https://manus.im/terms","url":"https://apps.apple.com/us/app/manus-ai-agent-automation/id6740909540?uo=4","source":"appstore","category":"Agent","score":36424,"rating":4.73776,"price":"Free","developer":"BUTTERFLY EFFECT PTE. LTD.","thumbnail":"https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/f4/b9/15/f4b915b7-688e-753d-8900-a5ddbc53ecf7/IconManus-0-0-1x_U007epad-0-1-0-P3-85-220.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/24/f9/b7/24f9b7cf-07e6-38e1-b733-e3f64862ee89/iOS-en-1.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/84/0b/c3/840bc354-8e7f-f52f-2ab3-c5fdf00d82cc/iOS-en-3.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/cb/7e/59/cb7e59a5-e867-0eb2-68d8-fa5ce2f2c4ba/iOS-en-4.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/92/27/68/92276835-25e2-86e8-efee-2efa43a72b33/iOS-en-6.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/e4/b9/0a/e4b90a35-6101-7a00-c1cf-ac454d35 . What used to take cycles now happens in parallel.\n\nEVERYTHING BUILT IN — ZERO SETUP\n\nAuthentication, database, hosting, and monitoring are all included from day one. No configuration, no infrastructure decisions. Build fully scalable web apps securely from the start.\n\n100+ INTEGRATIONS, NO API KEYS NEEDED\n\nConnect to OpenAI, Stripe, Google Workspace, enterprise data warehouses, and more. Turn your project into a fully connected system in minutes, not days.\n\nSECURE BY DEFAULT\n\nPre-deployment security screening, secure built-in services, and enterprise-grade controls — including SSO/SAML and SOC2 — so what you build stays protected.\n\nWHO USES REPLIT:\n\n- Founders and entrepreneurs building their first product or MVP\n- Designers who want to ship without depending on a developer\n- Product managers building internal tools and prototypes\n- Marketers who need campaign tools and dashboards\n- Students creating real projects for their portfolio\n- Anyone with an idea and no time to waste\n\nCreativity runs on Replit.\n\nGet started for free. Download and build something today.\n\nTerms of Use: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/","url":"https://apps.apple.com/us/app/replit-vibe-code-with-ai-fast/id1614022293?uo=4","source":"appstore","category":"Agent","score":20253,"rating":4.7152,"price":"Free","developer":"Replit, Inc","thumbnail":"https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/12/9a/73/129a7388-5786-1c93-55af-c5373ac4932e/AppIcon-0-0-1x_U007epad-0-1-85-220.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/b9/45/eb/b945eba5-d198-c6fa-e417-0f09ddfd8f51/iOS_iPhone_0.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/0d/84/eb/0d84ebaa-5063-e364-3e8e-ddc65d9b5f6b/iOS_iPhone_1.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/27/4a/5e/274a5e35-ea92-36c9-dfc0-53b92470f695/iOS_iPhone_2.png/320x480bb.jpg","https://is1-ssl stream of bad guys. \n\n• Hold to shoot! Neat game mechanics make Agent Action easy to play but endlessly entertaining, with enough tactical challenges in weapon selection, targeting and fire-rate to keep more experienced players engaged. Between levels, you’ll have the choice between health boosters, armor or more awesome firepower, and your choice could be the difference between victory and death.\n\n• Classic spy-caper style! The game’s slick graphics and funky soundtrack recall a host of classic spy movies, as you blast your way across deserts and the decks of cargo ships, along railway platforms, through train carriages, and into the high-tech lairs of supervillains, all while retaining the ineffable cool of an international man of mystery. \n\n• Follow that boat! Car chases, boat chases, and a series of heavily-armed bosses keep Agent Action on his toes and ensure plenty of variation in the game.\n\n• Nice arsenal! Complete levels to gain dozens of perks in the form of shotguns, sniper rifles, SMGs, RPGs and all the other deadly initials, as well as a host of pyrotechnical explosives that open up a variety of new gameplay options. You can also customize them to your own personal playing style.\n\n• Make friends on your travels! Every action hero needs sidekicks, and Agent Action has an address book full of useful contacts. Get cash for completing levels and use it to unlock these colorful playable characters, all paying tribute to classic Hollywood heroes and heroines.\n\n► A world of action at your fingertips!\n\nEasy to play but as gripping as any classic spy movie, Agent Action’s a game that brings big-screen thrills right to your phone. Indulge your inner international man of mystery, download Agent Action now and start saving the world one dead villain at a time.\n\nPrivacy Policy: https://say.games/privacy-policy\nTerms of Use: https://say.games/terms-of-use","url":"https://apps.apple.com/us/app/agent-action-spy-shooter/id1496621735?uo=4","source":"appst oter Agent: Sniper Hunt","longDescription":"Welcome to the high-octane world of relentless combat and strategic warfare! Prepare to immerse yourself in a thrilling showdown set against the backdrop of the untamed Wild West in \"Shooter Agent: Sniper Hunt\" In this adrenaline-pumping FPS game, you'll not only put your firepower to the test but also fine-tune your skills to become the ultimate sharpshooting assassin.\n\nFeatures:\n\nMaster Your Marksmanship: With an arsenal of diverse firearms at your disposal, you have the opportunity to sharpen your shooting skills and rise to the pinnacle of marksmanship excellence. Each trigger pull holds the fate of your mission.\n\nSurvival Amidst the Wild West: The unforgiving terrain and rugged Western Cowboy atmosphere set the stage for an intense battle for survival. Quick thinking and swift reactions are your allies in the midst of this adrenaline-fueled action.\n\nUrban Warfare Unleashed: Be on constant alert for surprise attacks lurking within the bustling cityscape. Execute your operations with the finesse and discretion of a seasoned assassin.\n\nStealth and Precision Assassination: Employ stealth tactics to silently close in on your adversaries, eliminating them with surgical precision. Operate in the shadows, rendering your foes powerless.\n\nHunter and Hunted: Experience the thrilling dynamic of becoming both the relentless hunter and the cunning prey. As your rivals relentlessly pursue you, your mission is to turn the tables and become the hunter.\n\nRise Through the Ranks in Battle Arenas: Elevate your tactical prowess and marksmanship skills to conquer the competitive battle arenas. Unlock rewards and accolades as you ascend to the pinnacle of glory.\n\nHeart-Pounding Action: Immerse yourself in a roller coaster of non-stop, action-packed gameplay. Engage in high-octane battles that will keep you on the edge of your seat throughout the gaming experience.\n\nShooter Agent: Sniper Hunt promises an immersive action-p
