,"machinelearning","openai","spracherkennung","news"],"heatScore":96.91,"detailRef":"details/mastodon%3Amastodon.social%2F117112002039460048.json"},{"id":"mastodon:mastodon.social/117113291455763800","sourceItemId":"mastodon.social/117113291455763800","title":"\"An expert witness testifying in a lawsuit about liability for a Houston explosion that killed three people and destroyed roughly 200 homes ","description":"@remixtures@tldr.nettime.org · \"An expert witness testifying in a lawsuit about liability for a Houston explosion that killed three people and destroyed roughly 200 homes used ChatGPT to write significant portions of his “expert report.” The man, who was hired by the industrial product conglomerate 3M, exposed his AI prompts publicly. They showed that he asked ChatGPT to help him “create an exceptional expert witness report defending the standard of care at 3M,” and that the report should “show how 3M is 0% at fault for the explosion at Watson Grinding.” The incident shows that artificial intelligence has made its way into courtrooms not just in AI-generated legal briefings, hallucinated cases, and adversarial “prompt injections,” but in expert witness testimonies. Court transcripts, deposition documents, and discovery records shared with 404 Media show extensive AI use in an extremely high profile case, where multiple people died and hundreds of millions of dollars in total liability are at stake in ongoing litigation about the explosion. The case also shows that the specific prompts used to create this type of expert testimony can be discoverable during a case, and that those prompts can be quite embarrassing. (Prompts provided in the case are here).\" https://www. 404media.co/show-how-3m-is-0-a t-fault-expert-witness-used-chatgpt-to-write-report-defending-company-in-deadly-explosion-lawsuit/ # AI # GenerativeAI # Chatbots # LLMs # ChatGPT # 3M # Law","url":"https://tldr.nettime.org/@remixtures/117113291190284401","source":"mastodon","category":"AI","categoryId":"ai","categoryIds":["ai"],"metrics":{"rawScore":13.5,"rawScoreLabel":"互动热度","votes":7,"comments":1},"publishedAt":"2026-08-17T22:50:06.000Z","tags":["chatgpt","ai","generativeAI","chatbots","llms","chatgpt","3m","law"],"heatScore":92.78,"detailRef":"details/mastodon%3Amastodon.social%2F117113291455763800.json"},{"id":"mastodon:mastodon.social/117111503621084786","sourceItemId":"mastodon.social/117111503621084786","title":"\"Expert Witness\" who did nothing but use ChatGPT to make stuff up. 😬 https:// infosec.exchange/@josephcox/11 7111490746162211 # AI # chatgp","description":"@ai6yr@m.ai6yr.org · \"Expert Witness\" who did nothing but use ChatGPT to make stuff up. 😬 https:// infosec.exchange/@josephcox/11 7111490746162211 # AI # chatgpt # law","url":"https://m.ai6yr.org/@ai6yr/117111502770105506","source":"mastodon","category":"AI","categoryId":"ai","categoryIds":["ai"],"metrics":{"rawScore":11,"rawScoreLabel":"互动热度","votes":5,"comments":2},"publishedAt":"2026-08-17T15:15:17.000Z","tags":["chatgpt","ai","chatgpt","law"],"heatScore":89.69,"detailRef":"details/mastodon%3Amastodon.social%2F117111503621084786.json"},{"id":"mastodon:mastodon.social/117111513778850847","sourceItemId":"mastodon.social/117111513778850847","title":"Throwing Rocks At The&nbsp;Internet The Internet was never perfect. It was always a work in progress. That’s usually considered a phrase wit","description":"@warnercrocker.com@warnercrocker.com · Throwing Rocks At The&nbsp;Internet The Internet was never perfect. It was always a work in progress. That’s usually considered a phrase with a good connotation. But that depends on the side of the coin you’re looking at. It always begs the question, progress for whom? Calling it enhshittification is apt, but it’s also an insufficient description. It implies that the mess can be cleaned up. I don’t think that’s the case. We’re too deep in the shit. Implementing Artificial Intelligence into everything has mucked up most things the same way that inserting ad-tech into everything did back in the early days of that craze. I’d wager that in the days of the ad-tech explosion 8 times out of 10 most of the updates we downloaded or were subjected to dealt more with ad-tech than “bug fixes and improving reliability.” It reminds me of the early days of DRM when there was a constant wack-a-mole game, trying to maintain and protect media copy protection schemes. &nbsp;I want to think that it cost more to keep fixing things than it ever yielded in profits, but that’s obviously naive on my part. We’re currently seeing the same with AI. The models are changing so rapidly that today’s new release or bug fix is probably outdated by the time it reaches most computers or smartphones. The pace is maddening and the disruptions for every day users even more so, including those who don’t even use the stuff. Given how things are going I don’t think even the purveyors of AI know what they are actually releasing. They feel like little kids trying to see who can throw a rock the farthest. Eventually, someone breaks a window. We really never know when a web service chooses to update, things just break. (Looking at you WordPress.) We rarely know what most updates to apps really mean. It’s becoming a rare thing to see a real list of bug fixes published alongside a release. The developers who do so deserve your business. The difference in this rock throwing frenzy is that many of the geeks who in the past worked hard to defeat copy protection and ad-tech are only too eager to help the AI purveyors throw their rocks further. There’s a lot of would be Oppenheimers out there. Set aside the potential dangers of using this tech for military use and malicious attacks. For everyday users of the Internet, the bitch of it is many of the AI changes we’re starting to see and those we will certainly see more of the in the future will be to further serve ad-tech as the AI industry inevitably pours that on to try and recoup some of its out of control costs. That’s an incestuous marriage that I’m not looking forward to seeing the rock throwing delinquents it spawns. (Image from on Kristine Jones on Shutterstock ) Thanks for reading. You can subscribe to this blog if you care to. You can also find more of my writings on a variety of topics on Medium at this link , including in the publications Ellemeno and Rome. I can also be found on social media under my name as above. This site does not use affilate links. #adTech #ai #ArtificialIntelligence #chatgpt #DRM #enshittification #Internet #technology #Writing","url":"https://warnercrocker.com/2026/08/17/throwing-rocks-at-the-internet/","source":"mastodon","category":"AI","categoryId":"ai","categoryIds":["ai"],"metrics":{"rawScore":6,"rawScoreLabel":"互动热度","votes":3,"comments":0},"thumbnail":"https://warnercrocker.com/wp-content/uploads/2026/08/shutterstock_442420324.jpg","publishedAt":"2026-08-17T15:18:05.000Z","tags":["chatgpt","adtech","ai","artificialintelligence","chatgpt","DRM","enshittification","internet","technology","writing"],"heatScore":78.35,"detailRef":"details/mastodon%3Amastodon.social%2F117111513778850847.json"},{"id":"mastodon:mastodon.social/117111615987196454","sourceItemId":"mastodon.social/117111615987196454","title":"Assuming I am more skilled that I am at coding and I have way more time than I actually have, what would I use to cluster 256x256 1D data? W","description":"@CCochard@sciences.re · Assuming I am more skilled that I am at coding and I have way more time than I actually have, what would I use to cluster 256x256 1D data? We acquire a 256x256 pixels image at which point we do a measurement (that is an array of length that depends on the measurement but it always the same inside an image). I know that my image is composed of 3 areas (maybe need to account for a 4th one for the spurious points). I want to be able to separate the 3 areas based on the features of the array. By visual inspection, it is easy to say whether the clustering is reasonable or not (I know where the areas are) Next step would be to get an average (or something more sensible) of the array in each of the area and compare it between the 3 areas. We have done brute force fitting of all the arrays with a sensible model and plotted the results, but it's inconclusive (distribution of results is larger than the difference of mean). # MachineLearning","url":"https://social.sciences.re/@CCochard/117111615918870077","source":"mastodon","category":"AI","categoryId":"ai","categoryIds":["ai"],"metrics":{"rawScore":5.5,"rawScoreLabel":"互动热度","votes":1,"comments":3},"publishedAt":"2026-08-17T15:44:04.000Z","tags":["machinelearning","machinelearning"],"heatScore":74.23,"detailRef":"details/mastodon%3Amastodon.social%2F117111615987196454.json"},{"id":"mastodon:mastodon.social/117113145784636693","sourceItemId":"mastodon.social/117113145784636693","title":"📰 US vaccination rates fall again as exemptions continue to rise, CDC data shows Again, the CDC did not publish a full report and instead s","description":"@feed@igeek.gamer-geek-news.com · 📰 US vaccination rates fall again as exemptions continue to rise, CDC data shows Again, the CDC did not publish a full report and instead simply put the data online. 📰 Source: Ars Technica 🔗 Link: https://arstechnica.com/health/2026/08/us-vaccination-rates-fall-again-as-exemptions-continue-to-rise-cdc-data-shows/ # AI # ArtificialIntelligence # DataScience","url":"https://igeek.gamer-geek-news.com/@feed/statuses/01M08WJ4TWX117XN969BQXAH6B","source":"mastodon","category":"AI","categoryId":"ai","categoryIds":["ai"],"metrics":{"rawScore":5,"rawScoreLabel":"互动热度","votes":3,"comments":0},"thumbnail":"https://files.mastodon.social/cache/media_attachments/files/117/113/145/642/178/062/small/d46dc43eae16c76e.jpeg","publishedAt":"2026-08-17T22:13:05.000Z","tags":["artificialintelligence","ai","artificialintelligence","datascience"],"heatScore":71.13,"detailRef":"details/mastodon%3Amastodon.social%2F117113145784636 "tags":["LLM","hacker news"],"heatScore":86.11,"detailRef":"details/hackernews%3A49335017.json"},{"id":"hackernews:49335595","sourceItemId":"49335595","title":"Show HN: HarnessRouter: Unified interface for agent harnesses","description":"Hey HN! We are building HarnessRouter, a canonical API for running Codex, Claude Code, Hermes, and other managed agent harnesses as your product backend. Before building HarnessRouter, I used to build our own agent harness for our products. I tried LangGraph, agent SDKs from different vendors, pydantic, LLM tool use &#x2F; function call, and so on. It&#x27;s a very heavy lifting engineering effort, and I am disappointed about the agent deliveries compared to what Codex, CC can deliver. That changed my mindset. The frontier labs and famous open source communities are already putting so much engineering effort to build the world&#x27;s best harnesses, why not leverage them directly instead of building our own, just like how we call LLM chat completion endpoints instead of training our own models? We provide a docker image to run HarnessRouter locally. ---------- Quickstart: docker pull harnessrouter&#x2F;harnessrouter docker run -d --name harnessrouter -p 127.0.0.1:3000:3000 -v harnessrouter:&#x2F;data harnessrouter&#x2F;harnessrouter docker logs -f harnessrouter Wait for the &quot;ready on :3000&quot; show up, then open the browser at http:&#x2F;&#x2F;localhost:3000. Default username&#x2F;password is harnessrouter&#x2F;harnessrouter Then in Integrations page, add your model provider credentials or API keys. In Harnesses tab, as of today we provide routing to Codex, Claude Code, and Hermes as base harnesses. You can customize any of them and configure harness instruction, MCP tools, and skills. Then go to Tasks and let them do jobs. ---------- Every harness has its own request&#x2F;response format and incompatible with each other. We propose Unified Harness Procotol [1] to standardize how an application talks to an agent harness. It covers harness selection and configuration, task execution, event streaming, sessions start cancel and resume, artifact management and delivery, and failure handling. It&#x27;s similar idea like LiteLLM, but for harnesses rather than models. HarnessRouter implements UHP. We provide an AGENTS.md [2] and your coding agent can follow it to integrate your application with the harnesses available. We also provide starter kits [3] to demonstrate some types of agentic products that can be built on HarnessRouter. It currently includes PPT agent, Spreadsheet agent, BI Dashboard agent, and Video generation agent. Can&#x27;t wait to hear what you think! [1] https:&#x2F;&#x2F;unifiedharnessprotocol.org [2] https:&#x2F;&#x2F;harnessrouter.ai&#x2F;agents.md [3] https:&#x2F;&#x2F;github.com&#x2F;harnessrouter&#x2F;starter-kit","url":"https://news.ycombinator.com/item?id=49335595","source":"hackernews","category":"Agent","categoryId":"ai","categoryIds":["ai","code","agent"],"metrics":{"rawScore":27,"rawScoreLabel":"积分 + 评论","votes":7,"comments":10},"publishedAt":"2026-08-17T18:33:38Z","tags":["LLM","hacker news","open source","AI agents"],"heatScore":84.72,"detailRef":"details/hackernews%3A49335595.json"},{"id":"hackernews:49332810","sourceItemId":"49332810","title":"Expert Witness Used ChatGPT to Write Report Defending Company in Lawsuit","description":"由 pavel_lishin 发布","url":"https://news.ycombinator.com/item?id=49332810","source":"hackernews","category":"AI","categoryId":"ai","categoryIds":["ai"],"metrics":{"rawScore":20,"rawScoreLabel":"积分 + 评论","votes":12,"comments":4},"publishedAt":"2026-08-17T15:40:12Z","tags":["ChatGPT","hacker news"],"heatScore":81.94,"detailRef":"details/hackernews%3A49332810.json"},{"id":"hackernews:49314731","sourceItemId":"49314731","title":"Ask HN: I created a web browser using Claude, everybody hates it","description":"I created a web browser, Northstar web browser, using Claude, Gemini and Chatgpt Codex, everybody hates it, insults me personally and calls it AI slop. https:&#x2F;&#x2F;github.com&#x2F;nordstjernen-web&#x2F;northstar-browser Does this mean that the AI coding services are a failure? Claude is a failure?","url":"https://news.ycombinator.com/item?id=49314731","source":"hackernews","category":"AI","categoryId":"ai","categoryIds":["ai"],"metrics":{"rawScore":20,"rawScoreLabel":"积分 + 评论","votes":4,"comments":8},"publishedAt":"2026-08-15T22:05:13Z","tags":["ChatGPT","hacker news"],"heatScore":81.94,"detailRef":"details/hackernews%3A49314731.json"},{"id":"hackernews:49336757","sourceItemId":"49336757","title":"Show HN: Doberman: The AI watchdog that stops Claude from deleting your database","description":"Landing Page: https:&#x2F;&#x2F;www.trydoberman.dev&#x2F; The Problem: AI guardrails only protect against 89% of dangerous commands. This may seem pretty good until you think of it as a lock that lets 1 in 9 intruders in. What is Doberman: Doberman is a two layer security system wrapped around your LLM monitoring every input, output and tool call. The first layer is deterministic based on state of the art security guidelines, the second layer is dynamic, learning from your use and personal preferences. How is Doberman different: It is a dynamic two-layer security system that sits at runtime and monitors every input, output, and tool execution, adapting with you as you work.","url":"https://news.ycombinator.com/item?id=49336757","source":"hackernews","category":"AI","categoryId":"ai","categoryIds":["ai"],"metrics":{"rawScore":11,"rawScoreLabel":"积分 + 评论","votes":5,"comments":3},"publishedAt":"2026-08-17T20:03:00Z","tags":["LLM","hacker news"],"heatScore":73.61,"detailRef":"details/hackernews%3A49336757.json"},{"id":"hackernews:49339349","sourceItemId":"49339349","title":"Un-AI Your Internet","description":"由 ErenayDev 发布","url":"https://news.ycombinator.com/item?id=49339349","source":"hackernews","category":"AI","categoryId":"ai","categoryIds":["ai"],"metrics":{"rawScore":10,"rawScoreLabel":"积分 + 评论","votes":6,"comments":2},"publishedAt":"2026-08-17T23:57:13Z","tags":["AI","hacker news"],"heatScore":70.83,"detailRef":"details/hackernews%3A49339349.json"},{"id":"hackernews:49308738","sourceItemId":"49308738","title":"OpenAI updates its Privacy Policy to include ads","description":"I got this email: Hi _____, We’re rolling out ads in ChatGPT and we’re updating our Privacy Policy to include information about how ads work and how you can control your experience. What’s changing Ads may appear on Free and Go plans beginning later this month. Plus, Pro, Enterprise, Business and Education plans do not have ads. Ad-free options remain available. To begin, ads will not be personalised. We select them using the current topic of your ChatGPT conversation and limited contextual information, such as your general location and device type. We do not use your past chats or memories to select these ads. Before we begin to personalise ads, we will first ask you to choose whether you would like to see more relevant and personalised ads. If you choose to participate, you’ll get relevant and personalised ads using information that stays only on ChatGPT, such as ads you&#x27;ve interacted with, or context from your chats. You will be able to manage ad personalisation in settings. For ads shown in ChatGPT, we use information about ads you view or interact with to measure and improve their effectiveness. Advertisers only receive overall information about how their ads perform, such as total views or clicks. What’s not changing Ads do not influence the answers ChatGPT gives you. Ads are always clearly labeled and are visually separated from ChatGPT responses. Your personal details and conversations with ChatGPT remain private and are not shared with advertisers. Advertisers do not have access to your chats, chat history, memories, or personal details. Learn more about ads in ChatGPT, your options for an ads free experience, and our privacy controls, including how we protect your data. Thanks, The OpenAI Team","url":"https://news.ycombinator.com/item?id=49308738","source":"hackernews","category":"AI","categoryId":"ai","categoryIds":["ai"],"metrics":{"rawScore":10,"rawScoreLabel":"积分 + 评论","votes":6,"comments":2},"publishedAt":"2026-08-15T08:09:19Z","tags":["ChatGPT","hacker news"],"heatScore":70.83,"detailRef":"details/hackernews%3A49308738.json"},{"id":"hackernews:49328934","sourceItemId":"49328934","title":"China Wants to Shape What the A.I. Knows","description":"由 pseudolus 发布","url":"https://news.ycombinator.com/item?id=49328934","source":"hackernews","category":"AI","categoryId":"ai","categoryIds":["ai"],"metrics":{"rawScore":8,"rawScoreLabel":"积分 + 评论","votes":6,"comments":1},"publishedAt":"2026-08-17T10:48:21Z","tags":["ChatGPT","hacker news"],"heatScore":66.67,"detailRef":"details/hackernews%3A49328934.json"},{"id":"hackernews:49334509","sourceItemId":"49334509","title":"Mind Viruses: Self-Propagating Ideas in Multi-Agent LLM Systems","description":"由 frotaur 发布","url":"https://news.ycombinator.com/item?id=49334509","source":"hackernews","category":"AI","categoryId":"ai","categoryIds":["ai"],"metrics":{"rawScore":7,"rawScoreLabel":"积分 + 评论","votes":5,"comments":1},"publishedAt":"2026-08-17T17:23:12Z","tags":["LLM","hacker news"],"heatScore":63.89,"detailRef":"details/hackernews%3A49334509.json"},{"id":"hackernews:49338973","sourceItemId":"49338973","title":"Google to buy Spirit Airlines business data for 0M","description":"由 symisc_devel 发布","url":"https://news.ycombinator.com/item?id=49338973","source":"hackernews","category":"AI","categoryId":"ai","categoryIds":["ai"],"metrics":{"rawScore":6,"rawScoreLabel":"积分 + 评论","votes":6,"comments":0},"publishedAt":"2026-08-17T23:12:51Z","tags":["AI","hacker news"],"heatScore":61.11,"detailRef":"details/hackernews%3A49338973.json"},{"id":"hackernews:49335529","sourceItemId":"49335529","title":"Artisinal developer aschews LLM assistance","description":"由 mplabelspace 发布","url":"https://news.ycombinator.com/item?id=49335529","source":"hackernews","category":"AI","categoryId":"ai","categoryIds":["ai"],"metrics":{"rawScore":6,"rawScoreLabel":"积分 + 评论","votes":2,"comments":2},"publishedAt":"2026-08-17T18:28:39Z","tags":["LLM","hacker news"],"heatScore":61.11,"detailRef":"details/hackernews%3A49335529.json"},{"id":"hackernews:49338338","sourceItemId":"49338338","title":"Agentic AI in a Smolbox","description":"由 jerrythegerbil 发布","url":"https://news.ycombinator.com/item?id=49338338","source":"hackernews","category":"Agent","categoryId":"ai","categoryIds":["ai","agent"],"metrics":{"rawScore":5,"rawScoreLabel":"积分 + 评论","votes":3,"comments":1},"publishedAt":"2026-08-17T22:07:38Z","tags":["AI","hacker news","AI agents"],"heatScore":48.61,"detailRef":"details/hackernews%3A49338338.json"},{"id":"hackernews:49334732","sourceItemId":"49334732","title":"If LLMs can't write, I doubt it can lead us to AGI","description":"由 andrewstetsenko 发布","url":"https://news.ycombinator.com/item?id=49334732","source":"hackernews","category":"AI","categoryId":"ai","categoryIds":["ai"],"metrics":{"rawScore":5,"rawScoreLabel":"积分 + 评论","votes":5,"comments":0},"publishedAt":"2026-08-17T17:37:37Z","tags":["LLM","hacker news"],"heatScore":48.61,"detailRef":"details/hackernews%3A49334732.json"},{"id":"hackernews:49335622","sourceItemId":"49335622","title":"Show HN: LLM choose-your-own-adventure game to go undercover as top CEOs","description":"由 arpit_bansal 发布","url":"https://news.ycombinator.com/item?id=49335622","source":"hackernews","category":"AI","categoryId":"ai","categoryIds":["ai"],"metrics":{"rawScore":4,"rawScoreLabel":"积分 + 评论","votes":2,"comments":1},"publishedAt":"2026-08-17T18:35:25Z","tags":["LLM","hacker news"],"heatScore":44.44,"detailRef":"details/hackernews%3A49335622.json"},{"id":"hackernews:49335602","sourceItemId":"49335602","title":"Show HN: A Buyer's Editor to Fix B2B Procurement PDF Hell with API and MCP","description":"22+ years as a Software engineer&#x2F;programmer. For a reason that only life can explain, in the last 8 years i went from Adobe Flash Specialist to owning a small solar installation business and a small electric and plumbing materials. o.O We had a problem every time that we had to resupply or shop for new goods. In Brazil, things are manual in B2B and restricted to PDF Quotations&#x2F;Proforma negotiations. Nobody has ecommerce, only the middlemen that resell what they buy from the factory with their margins on top. For better margins, direct from the factory is the way to go. Long story short. We wasted 2 weeks on a single supplier for just one order. On the supplier side, everything is a 100+- PDF pages catalog. One PDF page could have 100+ products that you have to manually extract into Excel with the product code (sku)(even with chatgpt and a gazillion of .final.final_right.final_corrected.xlsx(10).xlsx ), to simply ask for the price and minimum items for order &gt;&gt; receive another PDF &gt;&gt; Excel again to see prices, quantities, adjustments and even mistakes of items we didn&#x27;t quote. It was purchasing hell! So I built OrbitQuote to solve this. We used and validated it in our own shop. Today, OrbitQuote extracts catalogs, quotations&#x2F;budgets&#x2F;proforma invoices, excel files, pdf, etc, into a live editor that you can quickly see your order changes and send back in seconds only what you want to buy. From days to minutes. We also have built OrbitQuote Compare, which lets you compare the same products across multiples suppliers and choose the bast purchasing strategy. It&#x27;s seams simples. It&#x27;s not. Every suppliers writes the product in a different way. OrbitQuote understand this and aggregates the same product and choose the best fit automatically. I closed the Shop and Solar installation business and i&#x27;m focused 100% on OrbitQuote. All our users need to do, it&#x27;s drop their files and done, 95% of the boring work is done. No paywall to check out. Just register;","url":"https://news.ycombinator.com/item?id=49335602","source":"hackernews","category":"AI","categoryId":"ai","categoryIds":["ai"],"metrics":{"rawScore":4,"rawScoreLabel":"积分 + 评论","votes":4,"comments":0},"publishedAt":"2026-08-17T18:34:11Z","tags":["ChatGPT","hacker news"],"heatScore":44.44,"detailRef":"details/hackernews%3A49335602.json"},{"id":"hackernews:49317809","sourceItemId":"49317809","title":"Show HN: AlertChecker – get emailed when a plain-English statement comes true","description":"I built AlertChecker to help address a limitation with AI chatbots - they only respond when you&#x27;ve asked them something. You talk to them and they talk back. I wanted a way for them to tell you something of interest another time, when you&#x27;re not even in a conversation. For example, type a statement like &quot;the iPhone 16 Pro is back in stock at apple.com&quot; or &quot;it&#x27;s going to rain in London tomorrow,&quot; and AlertChecker uses AI models with live web search to monitor it periodically. You&#x27;ll then be emailed when it becomes true. No scraping rules to configure, no specific site integrations to pick, just a sentence in plain English. It&#x27;s a Next.js web app with a small Node backend service doing the actual checking in a continuous loop. There&#x27;s also an MCP server, so if you use Claude or ChatGPT you can create alerts by just asking in a normal conversation instead of opening the site. The number of checks is currently limited overall while I keep an eye on costs, so it&#x27;s shared across everyone using it right now rather than a fixed per-account quota. I&#x27;ll be raising that as I get a better sense of real usage patterns. Seems like this tool could have a very wide range of applications (given the statement can be literally anything under 4000 characters). Interested to hear about real-world uses beyond stock&#x2F;price checking or weather alerts.","url":"https://news.ycombinator.com/item?id=49317809","source":"hackernews","category":"AI","categoryId":"ai","categoryIds":["ai"],"metrics":{"rawScore":4,"rawScoreLabel":"积分 + 评论","votes":2,"comments":1},"publishedAt":"2026-08-16T07:48:00Z","tags":["ChatGPT","hacker news"],"heatScore":44.44,"detailRef":"details/hackernews%3A49317809.json"},{"id":"hackernews:49339599","sourceItemId":"49339599","title":"Google wins bankruptcy auction for Spirit Airlines emails, chats, documents","description":"由 sgustard 发布","url":"https://news.ycombinator.com/item?id=49339599","source":"hackernews","category":"AI","categoryId":"ai","categoryIds":["ai"],"metrics":{"rawScore":3,"rawScoreLabel":"积分 + 评论","votes":3,"comments":0},"publishedAt":"2026-08-18T00:29:15Z","tags":["AI","hacker news"],"heatScore":38.89,"detailRef":"details/hackernews%3A49339599.json"},{"id":"hackernews:49339145","sourceItemId":"49339145","title":"Show HN: A multiplayer coding environment for dev teams and agents","description":"As a hardcore programmer, I used to attend lots of hackathons, and collaboration was always a huge headache. Especially when everyone on the team was &quot;vibe coding&quot; their own parts. Agents would lose context, and individual solutions would end up out of sync and eventually fail to come together at the end. To fix this exact problem, I built Forklane. Forklane is a multiplayer coding platform with a full, built-in agent and orchestration stack. It’s designed to help dev teams and AI agents collaborate in live real time sessions seamlessly without stepping on each other&#x27;s toes and keeping all teammates agents synced. Check it out at https:&#x2F;&#x2F;forklane.ai Would love to hear community feedback and thoughts about the tool. Try it out in your teams and let me know","url":"https://news.ycombinator.com/item?id=49339145","source":"hackernews","category":"Agent","categoryId":"ai","categoryIds":["ai","agent"],"metrics":{"rawScore":3,"rawScoreLabel":"积分 + 评论","votes":1,"comments":1},"publishedAt":"2026-08-17T23:33:00Z","tags":["AI","hacker news","AI agents"],"heatScore":38.89, is new feature However, the feature hasn't been spotted in the beta yet. https://www. and","description":"@techwire@gamefan.net · One UI 9 gives your wallpaper a little life with this new feature However, the feature hasn't been spotted in the beta yet. https://www. androidauthority.com/one-ui-9- motion-photo-wallpaper-3699446/ # Tech # Technology # TechNews # AI # Gadgets # Software # Cybersecurity # Apple # Google # Microsoft # Startup # OpenSource # AndroidAuthority [Android Authority]","url":"https://social.gamefan.net/@techwire/117113320820364853","source":"mastodon","category":"工具","categoryId":"tools","categoryIds":["tools"],"metrics":{"rawScore":2,"rawScoreLabel":"互动热度","votes":1,"comments":0},"publishedAt":"2026-08-17T22:57:38.000Z","tags":["opensource","tech","technology","technews","ai","gadgets","software","cybersecurity","apple","google","microsoft","startup","opensource","androidauthority"],"heatScore":41.24,"detailRef":"details/mastodon%3Amastodon.social%2F117113320890518833.json"},{"id":"mastodon:mastodon.social/117113281534117296","sourceItemId":"mastodon.social/117113281534117296","title":"GPU Offload in Rust: Portable, Safe, and Fast Article URL: https:// arxiv.org/abs/2608.13759 Comments URL: https:// news.ycombinator.com/ite","description":"@techwire@gamefan.net · GPU Offload in Rust: Portable, Safe, and Fast Article URL: https:// arxiv.org/abs/2608.13759 Comments URL: https:// news.ycombinator.com/item?id=4 9334991 Points: 5 # Comments: 0 https:// arxiv.org/abs/2608.13759 # Tech # Technology # TechNews # AI # Gadgets # Software # Cybersecurity # Apple # Google # Microsoft # Startup # OpenSource # HackerNews [Hacker News]","url":"https://social.gamefan.net/@techwire/117113281485165250","source":"mastodon","category":"工具","categoryId":"tools","categoryIds":["tools"],"metrics":{"rawScore":2,"rawScoreLabel":"互动热度","votes":1,"comments":0},"publishedAt":"2026-08-17T22:47:38.000Z","tags":["opensource","tech","technology","technews","ai","gadgets","software","cybersecurity","apple","google","microsoft","startup","opensource","hackernews"],"heatScore":41.24,"detailRef":"details/mastodon%3Amastodon.social%2F117113281534117296.json"},{"id":"hackernews:49332751","sourceItemId":"49332751","title":"Launch HN: Speko (YC S26) – OpenRouter for Voice AI","description":"Hi HN! I&#x27;m Bek, founder of Speko, a platform that finds an optimal combination of speech-to-text, LLM, and text-to-speech models, given your constraints, among all our public benchmarked options, and tells you why. Demo: https:&#x2F;&#x2F;www.youtube.com&#x2F;watch?v=no2LY2gRh-c Typical production voice agent is an ensemble of three models: STT, an LLM, and TTS. Each of those layers offers a dozen credible vendors, and each month there are new models on the market. Almost everyone evaluates once, picks a stack of their choice, and never rechecks because switching from a vendor to another involves yet another integration and arguments about the numbers. The result is that you use voice agents running last quarter&#x27;s models while better and cheaper options are available. Before founding Speko, I spent four years as cofounder and CTO building voice agents for enterprises across Asia in 10+ languages. Each time a new speech model would arrive, we repeated the same ritual: hire native-speaking raters, benchmark it against our existing stack, and update production if it improved. Speko turns this process into an API. A team running thousands of calls a day told us: &quot;we can literally go to this dashboard, switch the model, and it will do it for us.&quot; How it works: you send a request with your optimization criteria (accuracy, latency, cost or balanced), language and region. The router filters to models which we measured for the given combination of constraints, benchmarks them, selects the winner, and returns a response with headers containing provider, model names, and the scores. The gateway prefetches signed session plans, so a new session dials the provider straight from memory; no control-plane round trip while a caller waits. Failover happens only during connection setup stage: if the provider refuses the connection attempt, we start connecting to the runners-up. Some of the customer stories: one founder came to us not knowing what to pick at all: he gave us his use case and now routes everything through the platform. A property management AI runs LiveKit in Python and had not updated STT or TTS since launch: they did not know their STT had high error rates on their calls, better options existed, and swapping always looked like an R&amp;D project. One team did not know which models to pick for Spanish. A medical team did not know which STT handles medical vocabulary best. In every case we helped find the right stack from the benchmarks, and now they route through us. The measuring part is public: we pass the same inputs to every model in one region in different dated runs and we publish the boards, including those where our selections perform worse than alternatives. A launch demo answers which 30-second clip sounds better; production asks which model survives minute eight, so we test spontaneous speech, money and dates, ten-minute takes, and the rankings change. We trained an automatic scorer for TTS naturalness on our blind head-to-head listening votes; on providers it has never seen a vote for, it picks the same winner our raters do about as often as raters agree with each other. We don&#x27;t train or sell models ourselves, that&#x27;s precisely how we keep our rankings impartial. We also open sourced the gateway for teams who want to avoid an extra network hop on the audio path and don&#x27;t want to share keys with our cloud ( https:&#x2F;&#x2F;github.com&#x2F;SpekoAI&#x2F;gateway , MIT): one Go binary, which is running as a sidecar in your agent&#x27;s container, speaks one local protocol over Unix socket, pins provider hosts and attaches your keys. In BYOK mode it doesn&#x27;t communicate with us at all. Notice that the anonymous, content-free telemetry is enabled by default, and one env var disables it. Cost: the gateway and BYOK setup will be free forever, we charge for the hosted router and managed keys with consolidated billing. Since we started the batch in late June, external usage has grown about 25 percent per week on average, front-loaded toward the launch weeks. I would love feedback from the community: how do you pick speech models now, and what makes you trust the third-party benchmark? https:&#x2F;&#x2F;speko.ai&#x2F;","url":"https://news.ycombinator.com/item?id=49332751","source":"hackernews","category":"Agent","categoryId":"tools","categoryIds":["tools","code","agent"],"metrics":{"rawScore":191,"rawScoreLabel":"积分 + 评论","votes":89,"comments":51},"publishedAt":"2026-08-17T15:36:18Z","tags":["automation tool","hacker news","open source","AI agents"],"heatScore":97.22,"detailRef":"details/hackernews%3A49332751.json"},{"id":"hackernews:49306800","sourceItemId":"49306800","title":"AI productivity gains drive net CO₂ increase in global energy–economy model","description":"由 littlexsparkee 发布","url":"https://news.ycombinator.com/item?id=49306800","source":"hackernews","category":"工具","categoryId":"tools","categoryIds":["tools"],"metrics":{"rawScore":14,"rawScoreLabel":"积分 + 评论","votes":14,"comments":0},"publishedAt":"2026-08-15T01:42:40Z","tags":["productivity","hacker news"],"heatScore":77.78,"detailRef":"details/hackernews%3A49306800.json"},{"id":"hackernews:49323972","sourceItemId":"49323972","title":"Productivity Framework Paraiso","description":"由 mansi1010 发布","url":"https://news.ycombinator.com/item?id=49323972","source":"hackernews","category":"工具","categoryId":"tools","categoryIds":["tools"],"metrics":{"rawScore":6,"rawScoreLabel":"积分 + 评论","votes":2,"comments":2},"publishedAt":"2026-08-16T21:38:50Z","tags":["productivity","hacker news"],"heatScore":61.11,"detailRef":"details/hackernews%3A49323972.json"},{"id":"hackernews:49322860","source ps://news.ycombinator.com/item?id=49332564","source":"hackernews","category":"代码","categoryId":"code","categoryIds":["code"],"metrics":{"rawScore":244,"rawScoreLabel":"积分 + 评论","votes":132,"comments":56},"publishedAt":"2026-08-17T15:24:34Z","tags":["open source","hacker news"],"heatScore":98.61,"detailRef":"details/hackernews%3A49332564.json"},{"id":"hackernews:49332387","sourceItemId":"49332387","title":"Ask HN: Is this the worst time to be human?","description":"With AI doing much of the work, how do we humans keep life interesting? Ex:- 1.Generate much of the code and remove the joy of developers that they had over all these years. 2. Generate Animation videos&#x2F;movies or Anime books. People who make a living by drawing because they like it will feel all the more miserable. 3. May be more scenarios can be listed If you are into a particular profession because you like it and get paid in addition, you have every reason to be miserable&#x2F; depressed. what are your thoughts? 1. Is this the beginning of golden age for people who does not have any good skill but just mediocre who will make a killing by using AI tools and drive away people who are into a certain profession because of passion? 2. Are creative people doomed? 3. What options are available ? 4. Looks like greed is causing miserable lives for everyone. 5. Perhaps passionate people will continue to do things the &quot;old way&quot; but cannot make a living or compete with AI folks. For ex:- drawing animation by hand will become less economical compared with AI generated unless you are faster than a speeding bullet? Please share your thoughts. Thanks","url":"https://news.ycombinator.com/item?id=49332387","source":"hackernews","category":"代码","categoryId":"code","categoryIds":["code"],"metrics":{"rawScore":108,"rawScoreLabel":"积分 + 评论","votes":16,"comments":46},"publishedAt":"2026-08-17T15:13:33Z","tags":["developer tools","hacker news"],"heatScore":91.67,"detailRef":"details/hackernews%3A49332387.json"},{"id":"hackernews:49316888","sourceItemId":"49316888","title":"The quirky personal homepages of programming language creators","description":"由 cjlm 发布","url":"https://news.ycombinator.com/item?id=49316888","source":"hackernews","category":"代码","categoryId":"code","categoryIds":["code"],"metrics":{"rawScore":106,"rawScoreLabel":"积分 + 评论","votes":64,"comments":21},"publishedAt":"2026-08-16T04:24:00Z","tags":["programming","hacker news"],"heatScore":90.28,"detailRef":"details/hackernews%3A49316888.json"},{"id":"hackernews:49321813","sourceItemId":"49321813","title":"Show HN: I shrank DeepSeek V4 Flash to 57GB and it wrote a compiler on my Mac","description":"I built a specialized package of DeepSeek V4 Flash 0731 (originally 284B total parameters, 13B active), preserving reasoning, tool calling and coding capabilities: https:&#x2F;&#x2F;huggingface.co&#x2F;steadfastgaze&#x2F;DeepSeek-V4-Flash-0731-... I let it write a minimal C compiler targeting ARM64, then test the result with Fibonacci and FizzBuzz programs, and it succeeded in less than 1 hour, with the full recording at: https:&#x2F;&#x2F;youtu.be&#x2F;XiwSilmV8B0 You can run it on Silicon Macs with my engine https:&#x2F;&#x2F;github.com&#x2F;steadfastgaze&#x2F;MoEspresso , while one of the core libraries developed to obtain this result is available at https:&#x2F;&#x2F;github.com&#x2F;steadfastgaze&#x2F;mlx-iqk . The above recording was on a 128GB memory MacBook M3 Max, but you can also run it on 32GB MacBooks with a very usable context (128K tokens) and projected 5 tok&#x2F;s. I did try it on a fanless 16GB memory MacBook Air M1 (1.39 tok&#x2F;s), but unfortunately the available context was very small. How: - First, efficient quantisation: mlx-iqk takes advantage of IQ_K tensor encoding, more efficient than the ones available via llama.cpp or barebones MLX, originally designed by Iwan Kawrakow - I also changed the layout to a k-contiguous one, to make it faster, at least in this Metal setup. - Second, expert pruning: each of the 40 learned-router layers had 256 experts, and not all of them are equally important for the coding use cases. I removed 80B parameters - this is a known technique called REAP, shared at https:&#x2F;&#x2F;www.cerebras.ai&#x2F;blog&#x2F;reap . - Third: balancing the cheapest IQ1_S_R4 tensor encoding (~1.5 bits per weight), selectively promoting projections to IQ2_KS or IQ2_K where the measured error reduction justified the bytes. One of the main ideas was not only to save relevant knowledge, but also to not make it forget how to... stop thinking, how to use reasoning. In the first experiments, it would sometimes reason for thousands of tokens without closing its thinking section, or it would go in loops. Then I solved this by heavily weighting tool-calling traces and structured reasoning in the calibration mix.","url":"https://news.ycombinator.com/item?id=49321813","source":"hackernews","category":"代码","categoryId":"code","categoryIds":["code"],"metrics":{"rawScore":26,"rawScoreLabel":"积分 + 评论","votes":20,"comments":3},"publishedAt":"2026-08-16T17:13:22Z","tags":["developer tools","hacker news"],"heatScore":83.33,"detailRef":"details/hackernews%3A49321813.json"},{"id":"hackernews:49335468","sourceItemId":"49335468","title":"Tim O'Reilly – Why Open Source Matters for AI","description":"由 rmason 发布","url":"https://news.ycombinator.com/item?id=49335468","source":"hackernews","category":"代码","categoryId":"code","categoryIds":["code"],"metrics":{"rawScore":19,"rawScoreLabel":"积分 + 评论","votes":19,"comments":0},"publishedAt":"2026-08-17T18:25:53Z","tags":["open source","hacker news"],"heatScore":79.17,"detailRef":"details/hackernews%3A49335468.json"},{"id":"hackernews:49335470","sourceItemId":"49335470","title":"Show HN: Visimer – open-source visual editor for Mermaid diagrams","description":"Hi HN, Nick here, founder at OpenKnowledge. We built an open source library, Visimer, for editing Mermaid diagrams with a what-you-see-is-what-you-get visual editor. Try the playground at https:&#x2F;&#x2F;visimer.com&#x2F;playground . You can rename labels, change shapes, add new nodes, etc. by clicking and dragging the visual canvas. We set out to build this originally for OpenKnowledge, our markdown wysiwyg editor, then realized it’d be great to share it as a proper embeddable component library so that other apps can leverage it as well. Our general take is that AI is great for generating content, but whenever you want to tweak fine details, for example to create an artifact sharable with others, point-edit functionality is much better. We built Visimer to bring that to Mermaid diagrams, just like we did for markdown. Some technical bits: - Leverages the native Mermaid.js renderer for visualizing the Mermaid diagram true to how it’s intended. We add point-edit functionality on top. - We tried re-generating the entire file on every edit, but found that it would eat comments and formatting, etc. The final approach maps the rendered SVG elements back to a CST, so we can then edit only the parts of the file that should change. You can pair the visual editor with any text-editor so you can have both visual and code-level editor experiences. The library provides bindings for Monaco and CodeMirror and is extensible. There&#x27;s also a low-level headless version. If you just care about being able to edit your Mermaid diagrams in your markdown, you can try it in the OpenKnowledge app (our OSS markdown IDE, available as Mac&#x2F;Linux&#x2F;Windows apps). Let us know what you think.","url":"https://news.ycombinator.com/item?id=49335470","source":"hackernews","category":"代码","categoryId":"code","categoryIds":["code"],"metrics":{"rawScore":14,"rawScoreLabel":"积分 + 评论","votes":14,"comments":0},"publishedAt":"2026-08-17T18:26:04Z","tags":["open source","hacker news"],"heatScore":77.78,"detailRef":"details/hackernews%3A49335470.json"},{"id":"hackernews:49338322","sourceItemId":"49338322","title":"Try any open source model for free","descrip y for capturing these workflows: Get paid to record your work · p(doom) Since we have a high quality bar and need really strong people in their fields, finding participants hasn’t been easy. Do you guys have any tips or ideas on how we can successfully reach these profiles? Any help is highly appreciated!","url":"https://news.ycombinator.com/item?id=49329291","source":"hackernews","category":"代码","categoryId":"code","categoryIds":["code"],"metrics":{"rawScore":3,"rawScoreLabel":"积分 + 评论","votes":3,"comments":0},"publishedAt":"2026-08-17T11:36:34Z","tags":["open source","hacker news"],"heatScore":38.89,"detailRef":"details/hackernews%3A49329291.json"},{"id":"hackernews:49328234","sourceItemId":"49328234","title":"Amethyst Vein – A cross-platform, open-source SwiftData replacement","description":"由 miakoring 发布","url":"https://news.ycombinator.com/item?id=49328234","source":"hackernews","category":"代码","categoryId":"code","categoryIds":["code"],"metrics":{"rawScore":3,"rawScoreLabel":"积分 + 评论","votes":1,"comments":1},"publishedAt":"2026-08-17T09:14:54Z","tags":["open source","hacker news"],"heatScore":38.89,"detailRef":"details/hackernews%3A49328234.json"},{"id":"hackernews:49334928","sourceItemId":"49334928","title":"Show HN: Schemagic – visual JSON Schema editor","description":"Working with business operations, I’ve found that maintaining data contracts between developers and business teams is hard. As developers, we have a lot of tools: OpenAPI, JSON Schema, validation libraries for our programming languages, and git to keep everything in. I think JSON Schema is the most universal option, but it’s still hard for non-technical people to read and edit. Schemagic is my attempt to create a place where technical and non-technical people can work together and share data contracts with each other.","url":"https://news.ycombinator.com/item?id=49334928","source":"hackernews","category":"代码","categoryId":"code","categoryIds":["code"],"metrics":{"rawScore":2,"rawScoreLabel":"积分 + 评论","votes":2,"comments":0},"publishedAt":"2026-08-17T17:50:46Z","tags":["programming","hacker news"],"heatScore":22.22,"detailRef":"details/hackernews%3A49334928.json"},{"id":"hackernews:49334829","sourceItemId":"49334829","title":"Show HN: An Hacker News TUI Reader, handcrafted in Rust","description":"I wanted to share what I&#x27;ve been working on and off for the last few years. I&#x27;m not a CLI GUI, I use GitKraken for Git operations for instance. I&#x27;m an avid lurker of Hacker News though, and I found that a read-only TUI reader was a great fit for my usage - and for allowing me to slack a bit at work ;) I&#x27;m proud of the UX I&#x27;ve developed over the years, and especially proud of the architecture that made it possible [0]. It has contextual help, persistent settings, navigation history, and so on. I just hope that this tool can be of use to others, even though it has plenty of room left for improvement. You can test hncli by cloning its repository [1], and building the project yourself with Rust&#x27;s cargo or Docker. [0] https:&#x2F;&#x2F;www.newstackwhodis.com&#x2F;blog&#x2F;hncli-2-architecture [1] https:&#x2F;&#x2F;github.com&#x2F;pierreyoda&#x2F;hncli","url":"https://news.ycombinator.com/item?id=49334829","source":"hackernews","category":"代码","categoryId":"code","categoryIds":["code"],"metrics":{"rawScore":2,"rawScoreLabel":"积分 + 评论","votes":2,"comments":0},"publishedAt":"2026-08-17T17:43:13Z","tags":["developer tools","hacker news"],"heatScore":22.22,"detailRef":"details/hackernews%3A49334829.json"},{"id":"hackernews:49319224","sourceItemId":"49319224","title":"Stop giving your email for simple dev tools: A zero-bloat 2026 toolkit","description":"由 zlvox 发布","url":"https://news.ycombinator.com/item?id=49319224","source":"hackernews","category":"代码","categoryId":"code","categoryIds":["code"],"metrics":{"rawScore":2,"rawScoreLabel":"积分 + 评论","votes":2,"comments":0},"publishedAt":"2026-08-16T12:01:07Z","tags":["developer tools","hacker news"],"heatScore":22.22,"detailRef":"details/hackernews%3A49319224.json"},{"id":"hackernews:49334621","sourceItemId":"49334621","title":"Open Sourcing the YC Application","description":"由 KarimWen 发布","url":"https://news.ycombinator.com/item?id=49334621","source":"hackernews","category":"代码","categoryId":"code","categoryIds":["code"],"metrics":{"rawScore":2,"rawScoreLabel":"积分 + 评论","votes":2,"comments":0},"publishedAt":"2026-08-17T17:30:34Z","tags":["open source","hacker news"],"heatScore":22.22,"detailRef":"details/hackernews%3A49334621.json"},{"id":"hackernews:49334301","sourceItemId":"49334301","title":"Show HN: Augur – see what is hidden inside your skills","description":"Augur is the tool I built having a bit of fear not knowing if something is hidden in the skills I am using more and more. It parses different types of files, works from command line as from the simple TUI, can scan a file or whole folder, and can create clean copies of files with hidden characters or watermarks. It supports jpeg, png, webp, gif, pdf, docsx&#x2F;xlsx&#x2F;pptx + ODF, any valid UTF-8, binary, and other formats. It has 13 detectors and 40 finding kinds, decodes four types of schemes, two types of cleaners. Free and open source - Apache 2.0","url":"https://news.ycombinator.com/item?id=49334301","source":"hackernews","category":"代码","categoryId":"code","categoryIds":["code"],"metrics":{"rawScore":2,"rawScoreLabel":"积分 + 评论","votes":2,"comments":0},"publishedAt":"2026-08-17T17:08:18Z","tags":["open source","hacker news"],"heatScore":22.22,"detailRef":"details/hackernews%3A49334301.json"},{"id":"hackernews:49332584","sourceItemId":"49332584","title":"Show HN: PageLM – Open-Source NotebookLM Alternative (React/Node/LangChain)","description":"由 nullure 发布","url":"https://news.ycombinator.com/item?id=49332584","source":"hackernews","category":"Agent","categoryId":"code","categoryIds":["code","agent"],"metrics":{"rawScore":2,"rawScoreLabel":"积分 + 评论","votes":2,"comments":0},"publishedAt":"2026-08-17T15:25:23Z","tags":["open source","hacker news","LangChain"],"heatScore":22.22,"detailRef":"details/hackernews%3A49332584.json"},{"id":"hackernews:49326177","sourceItemId":"49326177","title":"Open Source App for HT203U Thermal Camera (USB-C)","description":"由 Ruthalas 发布","url":"https://news.ycombinator.com/item?id=49326177","source":"hackernews","category":"代码","categoryId":"code","categoryIds":["code"],"metrics":{"rawScore":2,"rawScoreLabel":"积分 + 评论","votes":2,"comments":0},"publishedAt":"2026-08-17T03:11:55Z","tags":["open source","hacker news"],"heatScore":22.22,"detailRef":"details/hackernews%3A49326177.json"},{"id":"hackernews:49337799","sourceItemId":"49337799","title":"Show HN: Encrypted Git Remote Server","description":"I have been programming in the industry for years now and wondered how safe it was to entrust your code to companies like Github, etc. You are trusting they won&#x27;t steal your code or allow hackers in. That&#x27;s alot to ask from someone you don&#x27;t know, especially when you get others to sign NDA&#x27;s to look at your stuff. I&#x27;ve worked at big game companies that used Github. Seemed a bit strange. I&#x27;d feel happier not trusting the server at all but I still want a place to have a copy of my code and for collaboration. So I created Ghostfork. The client is all open source. It acts like a helper for git, being a middle man for all communication with the server. The ghostfork server is your new remote. Everything is encrypted before going out, and decrypted when coming back. I want to assume the server operator is not only not trustworthy -- they might even be incompetent.","url":"https://news.ycombinator.com/item?id=49337799","source":"hackernews","category":"代码","categoryId":"code","categoryIds":["code"],"metrics":{"rawScore":1,"rawScoreLabel":"积分 + 评论","votes":1,"comments":0},"publishedAt":"2026-08-17T21:19:33Z","tags":["programming","hacker news"],"heatScore":2.78,"detailRef":"details/hackernews%3A49337799.json
