r feedback with us! ","url":"https://apps.apple.com/us/app/field-agent/id364946558?uo=4","source":"appstore","category":"Agent","score":12040,"rating":4.64095,"price":"Free","developer":"Field Agent Inc.","thumbnail":"https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/f2/4c/b3/f24cb3a9-b799-ba60-fb6a-08f576db3847/AppIcon-0-0-1x_U007emarketing-0-11-0-85-220.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource115/v4/ad/90/0f/ad900fbf-aacf-e1c4-9de6-ff70bd3e8b15/459932e0-03e7-40df-9ea6-d4c0a21e9b39_iphone8-USA-1.jpg/392x696bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource115/v4/cc/24/24/cc242408-17f0-2893-2eb8-1b36dddcf52c/8085935b-8439-427e-a646-cc31d32a22d4_iphone8-USA-2.jpg/392x696bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource115/v4/58/97/ab/5897ab34-bab1-6762-a8da-87342fc64428/9b7e5b84-d572-45c5-b64a-0860f2734998_iphone8-USA-3.jpg/392x696bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource125/v4/19/d3/e3/19d3e37f-b14d-5b22-1321-1bece615d1f3/0bfc268d-a0dd-42be-b9fc-54a567de9ab9_iphone8-USA-4.jpg/392x696bb.jpg"],"publishedAt":"2026-08-11T12:05:45Z","tags":["Lifestyle"],"stats":[{"label":"版本","value":"3.23.41"},{"label":"大小","value":"38 MB"},{"label":"最低系统","value":"15.0"},{"label":"内容分级","value":"17+"},{"label":"更新日期","value":"2026-08-11"},{"label":"网站","value":"App Store"}],"comments":12040},{"id":"appstore-Agent-940006911","title":"Agent A: A puzzle in disguise","longDescription":"A suave secret agent escape room. Use your Bond like detective skills to infiltrate enemy spy Ruby La Rouge's secret hideaway and put a stop to her evil plans before she escapes! \n\nAre your secret agent skills on point? Find out as you assume the role of Agent A in this award winning indie point & click adventure full of retro futuristic contraptions, hidden objects, gadgets and clever logic based puzzles. But do be warned… Ruby La Rouge is no spy to be taken lightly! Explore a labyrinth of perplexing puzzles lex tasks for you.\n\n\nAGENT — AUTONOMOUS AI AGENT\nGive the Agent a task and watch it work. It uses multiple AI models, browses the web, writes code, and connects to your tools to complete complex multi-step tasks autonomously.\n• Research, analyze, and compile reports\n• Build and deploy websites and apps\n• Connect to Gmail, Google Drive, Jira, Slack, and more\n• Track progress with real-time task updates\n\nAI LISTENER — REAL-TIME MEETING INTELLIGENCE\nRecord any conversation and get live AI-powered transcription and insights.\n• Real-time transcription in 100+ languages\n• AI-generated suggestions while you listen\n• Automatic session summaries\n• Custom analysis templates (Key Points, Technical Analysis, or your own)\n• Chat with AI about any past session\n• Background recording — switch apps without losing audio\n\nADVANCED AI CHAT\nNatural, human-like conversations powered by 15+ language models. Ask questions, brainstorm, debug code, or tackle any topic.\n\nVOICE CHAT\nFull voice conversations with AI. Choose from multiple voices, switch between automatic and manual recording modes, and go hands-free.\n\nIMAGE & VIDEO GENERATION\nTurn text into visuals with Nano Banana, Flux Pro Ultra, DALL-E, Imagen, Ideogram, Recraft, and more. Generate videos with VEO 3, Runway, Kling AI, and Minimax.\n\nDEEP RESEARCH\nAI-powered web research with source citations. Get comprehensive, multi-source answers to complex questions with real-time activity tracking.\n\nCODE EXECUTION\nRun code directly in chat. Debug, generate snippets, and test ideas with a built-in terminal and playground.\n\nDOCUMENT ANALYSIS\nUpload files for instant summaries, Q&A, and analysis. Supports PDFs, images with OCR, and more.\n\nPERSONALIZATION\n• Custom instructions for tailored responses\n• Memory system that learns your preferences\n• Projects to organize conversations and files\n• Thinking mode for complex reasoning\n\n\n15+ AI MODELS IN ONE APP\nGPT-5 · o4 · Claude Opus 4.8 · Gemini · DeepSeek · Llama · Grok · Qwen · Perplexity · and more\n\n\nWhy Choose ChatLLM?\n• All the best AI models, one subscription\n• Multi-modal: Text, Voice, Images, Video, Documents\n• AI Agent for autonomous task completion\n• AI Listener for meeting intelligence\n• SOC-2 and HIPAA compliant — your data stays private\n\nThis app requires a subscription. Plans start at $9.99/month.\n\nTerms of service & privacy policy:\nhttps://abacus.ai/terms\nhttps://abacus.ai/privacy","url":"https://apps.apple.com/us/app/chatllm-ai-chatbot-agent/id6502844681?uo=4","source":"appstore","category":"Agent","score":3094,"rating":4.84357,"price":"Free","developer":"Abacus.AI, Inc.","thumbnail":"https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/dc/5d/ed/dc5ded7e-a298-f402-7a14-258bb2515311/AppIcon-0-0-1x_U007epad-0-0-0-11-0-0-P3-85-220.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/73/24/c7/7324c78b-fb5b-1005-955f-cb3229a46e8c/ChatLLM-01-models.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/45/71/32/457132e5-e2e2-b2ea-2798-aaa12394fae0/ChatLLM-02-routing.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/81/c7/c9/81c7c987-e626-1095-a065-0bde17ad74fd/ChatLLM-03-voice.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/84/59/21/8459219d-61d7-b02e-edaf-aebe25899c6d/ChatLLM-06-image.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/20/d1/89/20d18909-e261-d502-6229-b3d0dca4fffa/ChatLLM-05-listener.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/26/01/be/2601be42-23be-964c-24dd-484d4402b229/ChatLLM-08-document.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/67/08/81/67088104-2de5-c1e7-624a-bd8960488681/ChatLLM-07-research.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/af/ce/21/afce21f8-b784-b702-d2d1-b6078e32bb3e/ChatLLM-04-agent.png/320 tence! With the visual prowess of Google Gemini 3.1 Pro, Nano Banana Pro, Gemini 3.5 Flash, and OpenAI GPT-5.5 Thinking, command the AI to create stunning art, architectural mockups, or interior design concepts just by talking.\n\nAI VIDEO GENERATOR\nBring your ideas to life in motion. Just describe a scene with your voice and let the AI generate dynamic, high-quality videos from your text or photos. Create short clips, animate static images, and transform creative concepts into shareable video content in seconds.\n\nGET INSTANT ANSWERS\nThanks to our Smart AI Routing, you always get the most accurate and nuanced response. We leverage Google Gemini 3.1 Pro for deep analysis and OpenAI's GPT-5.5 for creative questions, ensuring the best model answers you.\n\nDEEP RESEARCH\nUnlock deep insights into your studies or work. Our AI performs in-depth analysis by tasking Google Gemini 3.1 Pro with gathering and cross-referencing complex data, while OpenAI's GPT-5.5 Thinking synthesizes the findings into a structured report.\n\nAI WRITING ASSISTANT\n- Generate outlines or full drafts for emails, blogs, and marketing copy.\n- Brainstorm creative ideas for any project.\n- Refine your text to perfection with advanced grammar and style suggestions.\n\nCOMPLETE DOCUMENT SUITE\nYour all-in-one mobile office, powered by voice. Dictate and create professional documents in Word (doc, docx), Excel, and PowerPoint (pptx) formats on the fly.\n\nPDF MASTER\nSummarize, rewrite, or translate any PDF document. Upload a file and use your voice to ask questions about the content, or use the built-in editor and scanner to sign & fill forms.\n\nDATA ANALYST\nTurn raw data into clear insights. Simply describe your data and ask the AI to generate charts, visualize trends, and provide key analysis without writing a single formula.\n\nStep into the future of productivity and creativity. Our commitment is to continuously refine and expand our features, harnessing the combined power of Google Gemini . The more fame they gain, the more cash flows into your pocket.\n\nUPGRADE YOUR TEAM\nImprove your office and expand your staff to take on more clients. Hire a top-tier Scout to uncover future superstars, a razor-sharp Commercial Manager to pull in sponsors, and a training-minded Coach to elevate your players’ skills.\n\nLIVE LARGE OR INVEST\nSuccess comes with perks. Spend your earnings on luxury properties, or invest in sports teams to prove you’re the real deal. Your lifestyle becomes part of your legend.\n\nBECOME A POWER PLAYER\nAs your reputation skyrockets, teams start calling you. Will you stay loyal to your early clients, or chase the richest offers? In the high-stakes world of basketball management, every choice shapes your legacy.","url":"https://apps.apple.com/us/app/basketball-agent-manager-star/id6755743091?uo=4","source":"appstore","category":"Agent","score":1209,"rating":4.85525,"price":"Free","developer":"Chimpanzee, LLC","thumbnail":"https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/75/4a/59/754a592b-a352-954f-2a8c-e19c0d2ccf26/AppIcon-0-0-1x_U007emarketing-0-11-0-85-220.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/6d/b1/91/6db19183-7e2c-2df1-2cd0-f6c8b62ffcd1/1.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/1b/18/ce/1b18ce3c-06e5-2f3d-6e31-627fbe5f0543/4.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/8f/60/6f/8f606f34-4dc8-f4a2-ee52-8e562bc69223/2.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/43/02/0f/43020f23-9b9f-b28f-995b-46547a93617b/3.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/ca/73/3b/ca733b23-dc55-195e-908b-3841ec793eda/5.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource221/v4/99/e4/03/99e403f1-c973-0852-4564-00ff66901557/7.png/320x480bb.jpg","https://is1-ssl.mzstatic.com/image/thumb/PurpleSource211/v4/31/ad/fa/31adfa7e-dfc8-fe8 et filthy rich and retire a wealthy person. How quickly can you do it and get out of this dirty business?!","url":"https://apps.apple.com/us/app/hockey-agent-team-manager-sim/id1117972903?uo=4","source":"appstore","category":"Agent","score":1007,"rating":4.66235,"price":"Free","developer":"Top Drawer Games Limited","thumbnail":"https://is1-ssl.mzstatic.com/image/thumb/Purple128/v4/02/d1/0e/02d10e7b-9adc-cd6d-32de-aaf88306a428/AppIcon-0-1x_U007emarketing-0-0-85-220-0-7.png/512x512bb.jpg","screenshots":["https://is1-ssl.mzstatic.com/image/thumb/Purple60/v4/fc/b0/0a/fcb00a79-ba01-1e1c-56c5-3a748b431982/pr_source.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/Purple60/v4/32/ce/bb/32cebb9c-ea47-92e2-94f3-d931cf8bd5c2/pr_source.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/Purple30/v4/78/c7/e3/78c7e3ff-bebd-3d06-d6b2-a63ace4ead1e/pr_source.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/Purple30/v4/17/4b/9e/174b9ea0-4725-acf5-5905-fef42efe55be/pr_source.png/392x696bb.png","https://is1-ssl.mzstatic.com/image/thumb/Purple20/v4/32/bb/00/32bb00ee-eea3-12a1-66db-c007bbd7aba2/pr_source.png/392x696bb.png"],"publishedAt":"2018-10-23T19:38:22Z","tags":["Games"],"stats":[{"label":"版本","value":"2.2.2"},{"label":"大小","value":"105 MB"},{"label":"最低系统","value":"9.0"},{"label":"内容分级","value":"4+"},{"label":"更新日期","value":"2018-10-23"},{"label":"网站","value":"App Store"}],"comments":1007},{"id":"appstore-Agent-530457204","title":"Agent Dash","longDescription":"Save the world in style.\nJoin over 20 million players in the ultimate spy adventure! Dash, dodge, and blast your way through high-stakes missions in this fast-paced action runner from the creators of Flick Golf, Blocky Football, and Blocky Pirates.\n\nYour mission, should you choose to accept it...\nPlay as the daring Agent Dash, Her Majesty the Queen, or a lineup of suave heroes and dastardly villains. Race through secret lairs, volcano bases, and collapsing cities as you take down the evi documents, spreadsheets, research, images, podcasts, and more\n• File management — all your agent's outputs in one place\n• Calendar integration — auto-join scheduled meetings\n• Contact book with meeting history per person\n• Share meetings via link or email\n• 106 transcription languages with auto-detect\n• 14 app interface languages\n• Available on iOS, Android, web, and desktop\n\nWHO IT'S FOR\n\nProfessionals who want to stop taking notes and start acting on them. Sales teams, consultants, founders, researchers, project managers, and anyone whose work lives in meetings.\n\nYOUR DATA STAYS YOURS\n\nEvery user gets their own isolated agent instance. Your meetings, files, and preferences are private to you — never shared across accounts.\n\nGET STARTED\n\nDownload Meeting.ai, sign in, and join your first meeting. The agent handles the rest.","url":"https://play.google.com/store/apps/details?id=ai.meeting.app&hl=en&gl=us","source":"googleplay","category":"Agent","rank":9,"score":440131,"rating":4.5,"price":"Free","developer":"Meeting.ai","comments":10,"thumbnail":"https://play-lh.googleusercontent.com/2PP5L54w-ik0sMrP4nzUjMctkG5A38XiI11CQchMmThjTyh7fwojME1YlJN3tTDV1YU19wPF5nI_5_UfuLmA0S8","screenshots":["https://play-lh.googleusercontent.com/p3Hs0h3IRX8pr45jjTEbmNfkpWeu-W7OBwKURbPiwLAQ0eQkZRMCFL9fN8GamNje3Bqi3IQ2JaVEjUtDACRmuQ","https://play-lh.googleusercontent.com/X8vuLl79XL9XIQnlfUBbFDXkWvB4K9vujZeGwFYwsd_rP_DEWPSwTPRGtA5RLeP8HG8e04Z_Ro5-Aojm-XIrjw","https://play-lh.googleusercontent.com/Kp98AYYIwTGVNGxBL52eQjBJc8d6H1UjoGgHPXaiESOBxCRVTHZWc2uS0gF7CiIDNibKrmcnxcicuBcSoFCK9Q","https://play-lh.googleusercontent.com/ekGKBP2X2KIarH4kSXzo8VifVhIaWlfqTfGvVL2GELEtkb0NhUbl7sO6Qfh2U0DNKHni_dewQVWdN_gLt7g0_g","https://play-lh.googleusercontent.com/GSkGL_xCNP01rYMkdx7b5PGBAG39cpr_h6AHKuZgqLRFG_OjzZxPNWbsJQCYf_wh57XLNcvc4YUqGI2kSPM8aw","https://play-lh.googleusercontent.com/2TSf-Li9D5n3mLkvWL7uOapBiL2T8fu3h-aBgB5unRX3Fi_pet2Ws0_5UyTjQAmnWEQfwyyATJXcMYNRc2oz0g","https://play- red.\n\n\nYour Personal AI Agent\n\nFig doesn't just answer questions, it takes action:\n\n• Research any topic and deliver cited reports\n• Generate slide decks, videos, music, and podcasts\n• Build websites and web apps from a description\n• Create and run your own custom AI agents\n• Connect your tools and automate recurring work\n• Talk to Fig hands-free with the voice agent\n\n\nBuild Your Own Agents\n\nCreate custom AI agents for any job, each with its own instructions, tools, knowledge, and memory. Share them with your workspace, or set them to run automatically and deliver results to Slack, Telegram, or WhatsApp.\n\n\nResearch & Reports\n\nAsk Fig to research anything: competitors, markets, trends, or technical topics. It pulls from live sources and delivers a formatted report you can share or export.\n\n\nSlides & Presentations\n\nDescribe the deck you need. Fig generates professional slides with structure, visuals, and key points, ready to present or customize.\n\n\nVideo, Music & Podcasts\n\nTurn ideas into media. Generate and edit videos, compose music, and create studio-style podcasts from your own sources, links, or documents.\n\n\nAI Website Builder\n\nCreate professional websites from a simple description, with lead capture, analytics, and custom domains you can buy and connect in-app. Tap any element to edit it, and roll back to earlier versions anytime.\n\n\nTalk to Fig\n\nHave a natural voice conversation and Fig executes as you speak. Share your screen or camera live so it can see what you see and help in the moment.\n\n\nConnect Your Tools\n\nLink the apps you already use, including Gmail, Google Drive, Calendar, Notion, Slack, Figma, and Canva. Fig works across them to get things done.\n\n\nScheduled & Automated Tasks\n\nSet it and forget it. Fig runs tasks on a schedule: daily briefings, weekly reports, monitoring, and more. Your agents keep working even when you're away.\n\n\nSharable Chats\n\nTurn any conversation into a shared resource. Generate a link to share your chat, including all outputs, reports, and files.\n\n\nChoose Your Model\n\nPick the AI that fits the task. Choose from leading models by OpenAI, Anthropic, Gemini, Grok, and more.\n\n\nAI Creative Studio\n\n• Generate images from text prompts\n• Edit photos with AI-powered tools\n• Design logos with one tap\n• Create templates and graphics for any project\n\n\nBuilt For Everyone\n\nFig is for anyone with an idea:\n\n• Entrepreneurs launching a product or service\n• Freelancers building a portfolio or pitching clients\n• Students creating study aids and research reports\n• Creators producing videos, podcasts, and graphics\n• Small business owners managing sites and content\n• Teams sharing agents and collaborating via chat\n\n\nOne Agent. Unlimited Capabilities.\n\nOne conversation. Fig understands what you need and handles it, from building a website to producing a video to running your own custom agents. Just describe what you want.\n\nStart creating for free. Upgrade anytime for more credits and premium features.\n\n\nFor terms of service and privacy policy:\nhttps://www.hellofig.io/termsofuse\nhttps://www.hellofig.io/privacypolicy","url":"https://play.google.com/store/apps/details?id=com.hellofig.FigApp&hl=en&gl=us","source":"googleplay","category":"Agent","rank":6,"score":247334,"rating":4.470852,"price":"Free","developer":"Fig Technology Inc.","comments":241,"thumbnail":"https://play-lh.googleusercontent.com/WDL1jAST4kLtrkkuX3cgwPezfl5HF1-fYREKlf3o5DayBn9SukBVUB3XJCh8GnRsu3m0Z79Jl7GNOlPo54dr","screenshots":["https://play-lh.googleusercontent.com/4KybYs-ERkU9RrmarXRurjDLG5cBX-WebqxY7HC0sDo8duVcGF1AvkLly-P_o2l2SQhcSjSmY_IXEDEOsvxO","https://play-lh.googleusercontent.com/GQw_VKrwht20jilIqHLtPNB4KoFVv2ixhyiHk_FcG8u_HMzzZBXfo3PthBeQXEnNyx0i5iWs__g7d8yajeNOZR0","https://play-lh.googleusercontent.com/OneZVSuVcjPjJdUrb_zNfmIQvE1sV6TGqZdq0T0nGerZnoT7pgHO-SJBOrkOtwd2QRjvWo6qhHs_xwYpS-ArJQ","https://play-lh.googleusercontent.com/v0kishkw8qb454VA ost account is required, but before chatting you must add and enable a provider, enter an API key or endpoint if required, and select a model for the default assistant. Chat history stays on your device, and requests go to the services you choose.\n\nUse multiple AI models in one app\n\nDifferent models are useful for different tasks.\n\nConnect OpenAI, Claude, Gemini, OpenRouter, DeepSeek, Qwen, Mistral, Ollama, Azure OpenAI, Amazon Bedrock, NVIDIA, and custom OpenAI-compatible services.\n\nChoose a model for writing, switch to one with web search for research, or use a vision-capable model for images and files. Your conversations no longer need to be scattered across different apps.\n\nBuild AI agents for the way you work\n\nStart with a built-in agent for writing, translation, learning, or research. You can also create your own with custom instructions and prompts.\n\nChoose a model for each agent, customize its name and avatar, and enable web search or tool calling when the selected model supports them.\n\nFind current information on the web\n\nGive supported models access to web search so they can find and organize up-to-date information.\n\nUse ChatBoost to:\n\n• Find and summarize recent information\n• Compare information from different sources\n• Research topics and create content\n• Extract web pages and organize key points\n• Include current information in answers\n\nSome models also provide native search. You can configure other search services when needed.\n\nLet agents take action\n\nWith tool calling, supported AI agents can carry out tasks such as creating calendar events, generating images, or running available tools.\n\nChatBoost also supports MCP for connecting additional external tools.\n\nOn Android, you can set ChatBoost as your system digital assistant for faster access.\n\nUse AI Keyboard in other apps\n\nChatBoost AI Keyboard brings AI to wherever you are already typing:\n\n• Write and reply to messages\n• Rewrite awkward sentences\n• Translate between languages\n• Change tone and writing style\n• Polish emails, notes, and social posts\n• Draft replies using the context of a conversation\n\nUse AI inside messaging, email, browser, and note-taking apps without repeatedly copying text.\n\nWork with text, images, files, and voice\n\nChatBoost supports more than text chat.\n\nUpload images for compatible vision models to understand, use supported models to generate images, and add documents, audio, or video as conversation attachments. You can also speak your prompts and listen to responses with text-to-speech.\n\nLong text can become an attachment, while code and Markdown stay readable.\n\nMore control when you need it\n\nFor supported models, adjust settings such as Temperature, Top-p, Max Tokens, reasoning effort, and streaming responses.\n\nYou can also:\n\n• Add custom models and API endpoints\n• Manage multiple API keys\n• Search, pin, and organize conversations\n• Review token usage\n• Import, export, and back up data\n• Customize fonts, themes, and voice settings\n\nConfigure a provider and default model before chatting; advanced settings remain available when you need more control.\n\nYour models, data, and setup stay under your control\n\nChatBoost does not require a product account and does not lock you into one model or provider.\n\nAPI keys and chat history are managed on your device. Required content is sent to the model, search, or tool service you select and handled under that service's terms and privacy policy.\n\nQuestions or feedback? Contact us at fb@muggle.studio.","url":"https://play.google.com/store/apps/details?id=studio.muggle.chatboost&hl=en&gl=us","source":"googleplay","category":"Agent","rank":3,"score":27103,"rating":4,"price":"Free","developer":"Muggle Studio","comments":41,"thumbnail":"https://play-lh.googleusercontent.com/T3CAUVTyQVRydZSmaJjYJEU7K05vKBxLC_-m_ahnbVd0n0JnfVqRXPk83tgL2m2EwxShBh90Zg8jVZDaPGpw9Q","screenshots":["https://play-lh.googleusercontent.com/YcxirleKFW5kv8 ord (EHR) documentation is a major contributor to physician burnout. A physician’s time is critical to care delivery, and time spent on administrative tasks takes time away from patients, which can lead to disconnected care experiences. Physicians need an intelligent, contextual, and readily available solution that can proactively assist them to free up time for direct patient care. Oracle Clinical AI Agent helps enhance physician work experiences and drive focused patient interactions through Al-powered clinical intelligence, voice-driven assistance, and simplified workflows.","url":"https://play.google.com/store/apps/details?id=org.oraclejet.maxapp&hl=en&gl=us","source":"googleplay","category":"Agent","rank":7,"score":8624,"rating":3.5714285,"price":"Free","developer":"Oracle America, Inc","comments":4,"thumbnail":"https://play-lh.googleusercontent.com/2Uh-jf7T51wgL9Helscdoml7NjjLIENNWLIsAdbRcxqQrYf21zCwpggggoni7qUuobpeYwFXJSeo5lCuanUU","screenshots":["https://play-lh.googleusercontent.com/5DV3vXjO7kPrOeBV_tMY5C1NyKTrQ55iRBtJyLlqwX3nlBgodi2iWQ-I3und02bb8cCIiPJYaWZWJwt1Hn1sew","https://play-lh.googleusercontent.com/wzaf7LSWUOg307QVb0U7UD9-68ymHa758SF6kXlhZ60438zK4jNvljh28hy8QaxNoGMTaWafr5VH4uMNS1NW","https://play-lh.googleusercontent.com/-GJG_efVnvticCaIojmNe2193_mlAmWXG8x_ik2Ma5-zQx2RYFMgV4Hbe9mvQM0_1kSOMcNZQN8thha_0U1o","https://play-lh.googleusercontent.com/egqeihXcnqEAD9PtWGnbLgU-BZ4_WItGzU7uEmCjNahRbS9gtSOGL-NSgjxTUQlhkUcDax7ktDxuWxzyhcPe","https://play-lh.googleusercontent.com/S0-x6mB0pyOqZ6lWk94wiPiyLh85MfXU28ow04H0Wh5tzSPEyH2gIw_0DDpTJP4OS9AUrfEb4DOhtGoEj4Pv","https://play-lh.googleusercontent.com/pBo5DJLDqCLlMfjdJJ6Ejg_brOsVfLm3mStO8Z7P424tJqFFpXrUTEYbbNXkYucxPSg7Pyvff9-H2oKfeXfBRwM","https://play-lh.googleusercontent.com/GTKN4DVPMEB_M_JUdam6VgGuIjRK4cOtViiXUnHHR9nerB8_4XjRS2HTHaA0ykzjFh5n71ytQcaJyyn-AIqk-Q","https://play-lh.googleusercontent.com/aWzQQSVrUiEmtCLcL2xp05ab7GY5Gw4gBRR1bIbQiOXvMB3Jz2SOAETjs_TVgXuBtPN_xz3C-sTogSARb2oyww","https://play-lh.googleusercontent.com/S0-x6mB0pyOqZ6lWk94wiPiyLh85MfXU28ow04H0Wh5tzSPEyH2gIw_0DDpTJP4OS9AUrfEb4DOhtGoEj4Pv","https://play-lh.googleusercontent.com/pBo5DJLDqCLlMfjdJJ6Ejg_brOsVfLm3mStO8Z7P424tJqFFpXrUTEYbbNXkYucxPSg7Pyvff9-H2oKfeXfBRwM","https://play-lh.googleusercontent.com/GTKN4DVPMEB_M_JUdam6VgGuIjRK4cOtViiXUnHHR9nerB8_4XjRS2HTHaA0ykzjFh5n71ytQcaJyyn-AIqk-Q","https://play-lh.googleusercontent.com/aWzQQSVrUiEmtCLcL2xp05ab7GY5Gw4gBRR1bIbQiOXvMB3Jz2SOAETjs_TVgXuBtPN_xz3C-sTogSARb2oyww"],"publishedAt":"Aug 12, 2024","tags":["Medical"],"stats":[{"label":"版本","value":"2026.3.01"},{"label":"安装量","value":"5,000+"},{"label":"内容分级","value":"Everyone"},{"label":"更新日期","value":"2026-08-11"}]},{"id":"googleplay-Agent-openally.ai","title":"OpenAlly: Offline AI Agent","description":"Private AI agents on your phone. Bring any model — your chats never leave.","longDescription":"Your AI. Your phone. Your rules.\n\nOpenAlly turns any AI model into your own private agents — running on your Android phone, not in someone's cloud. No OpenAlly server ever sees your conversations.\n\nMost AI apps send everything to their servers. OpenAlly keeps the whole engine — the agent runtime, your memory, your skills, and every message channel — on your device. When you talk to your AI, the only phone involved is yours.\n\n🧠 BRING YOUR OWN AI\nConnect the model you want, your way:\n• Your API key — Anthropic (Claude), OpenAI (GPT), Google Gemini, OpenRouter, Amazon Bedrock, NVIDIA.\n• A plan you already pay for — sign in with ChatGPT, Gemini, or GitHub Copilot. No second bill.\n• Your own machine — Ollama or any OpenAI-compatible server.\nEleven providers built in, plus any OpenAI-compatible model. Switch the brain anytime; your agents and setup keep working.\n\n💬 ONE AI ACROSS YOUR MESSAGING APPS\nYour agents show up where you already chat — 12 channels: WhatsApp, Telegram, Discord, Slack, Signal, LINE, Google Chat, Mattermost, Nextcloud Talk, Zalo, Twitch, and iMessage (with a Mac). Give each channel its own agent, approve who's allowed to talk to it, and reply in any language. (More channels on the way.)\n\n🤖 A TEAM OF AGENTS, NOT ONE BOT\nBuild as many agents as you need — each with its own model, personality, knowledge, and guardrails. Hand your main agent a big job and watch it split the work across specialists, then bring it back as one clean answer.\n\n📲 IT DOES THINGS, NOT JUST CHAT\n• App Automations: show it a phone task once — book a ride, post an update — and it replays hands-free. It self-heals when the screen changes and hands control back to you at logins and payments. It never pays, and never sees your password.\n• Web automation, scheduled tasks and reminders that fire back into your chat, an on-device Python runtime, and an App Builder that builds real little web apps just by chatting.\n\n🛠️ ON-DEVICE MINI-APPS (15 built-in skills in all)\n• SMS Analyser — your texts become spending insights, bill reminders, and scam/phishing warnings, all on-device.\n• Voice Notes — record, transcribe, and summarize on your phone, then share a clean card.\n• Flare — turn notifications into AI actions: auto-reply, summarize, log.\n• Knowledge Base — drop in PDFs, pages, and notes, and ask.\n\n📱 FULL PHONE CONTROL WITH ASTER\nPair the Aster companion and your AI gets real device access — calls, SMS, camera, notifications, files, location, mic — over a secure local connection. Owner-only, and you grant each power.\n\n🛡️ BUILT SO WE CAN'T PEEK\n• No OpenAlly server processes or stores your chats.\n• API keys sealed in your phone's secure hardware (Android Keystore, AES-256).\n• Optional backup is end-to-end encrypted on your phone before it touches your own Google Drive — locked with a 12-word recovery code only you ever see.\n• You approve who can message your AI; risky actions pause for your OK; banking and payment apps are blocked from automation by default.\n\nFree to start, ad-supported (Google AdMob), with anonymous crash reports — never your conversations. Android only today.\n\nOpenAlly — AI for the rest of us.","url":"https://play.google.com/store/apps/details?id=openally.ai&hl=en&gl=us","source":"googleplay","category":"Agent","rank":8,"score":3234,"rating":3.5,"price":"Free","developer":"TheAppStackStore","comments":3,"thumbnail":"https://play-lh.googleusercontent.com/FEsplWWSORZ0YKY2VZMYmG3ZgpW27UtFiv4wttj1NXgMxAKk4MLEFxCDW6snuwHnjMyPSkJR1inRWWYKdyrTVA","screenshots":["https://play-lh.googleusercontent.com/cucwU8lceK2Jbkc_CfTwjLzFKiG2EmX_5aMJLLM2tqBcW4nWxaUB9OdSLl6w_6SUWe-RIjrcr2Fad9K1v3Q3nQ","https://play-lh.googleusercontent.com/tmSXTx9oGR8dCKtn_XMfy5aIED7F3f_TFGMSBUPjl2itdi2qia08RpY8x-aUIK5WRPG45zvFTZvEFbMDy3WkZg","https://play-lh.googleusercontent.com/cHNFV7uygyAqBQrCUnwP-deaLtvNiWlG_on-TsEsQ_87NvcBW6P75RDNXG_yZXJm_8nDFTHKAbbdbKyTfnhH","https://play-lh.googleusercontent.com/uQzgEYJkNg7r8tPErKU7zdRzoRUb2BiGW5-D7mft6q_2YUMvMCaPSPafN0EwKvMV0oiQghjqnryDenxDla4yHg","https://play-lh.googleusercontent.com/IJkMoBh7z4Hbd5nVoRUc4DsXnPgoFVMMxpC9bFWlQp1Px-trYFp222WjFvhwK6uglSlUVXIGtzyRwx55_uOaNA","https://play-lh.googleusercontent.com/9RaDGeSOxfVCT3KTvnFKA6HAvKmKRWzryBBlmCXctu25ShPnRAztx0-AuJvWnDTiihZ31wu0HtybmP0bWEAz","https://play-lh.googleusercontent.com/GgV_WWGYUrviM4vhui8fZKN___94Y-1Uv1ylJYGce50tKnxpnmsYYdYtEyGPacUay6njKod4uWz36Ejj0okwyA","https://play-lh.googleusercontent.com/e2ZaHzkk4JGhJkULUtYb2gqdyvIiU0XSXhUr_VkUTD9SFoeJFUE3AzgSzVQulZVGFjmFRHhRjrfzfhcOgYcD","https://play-lh.googleusercontent.com/5OT9trnRSvmpGVYOwXE-RO-buH87Smx-pkRCIqXwhBAB053b7UggokkyiQYT4e-L4zfcDaah4r9WNUV3lzU9454","https://play-lh.googleusercontent.com/KDQpy2Pq-gxXUgKVG8D3L7Po81Piotug6cETZOKNvqG3VnH--in3jf8kI3FQ3dlu1fHQyIyP_R3cA6HzjA7avA","https://play-lh.googleusercontent.com/99ZwsJlv4XmFtzKla3J79KoGNvAGk6MAHti0033uMFyEoCmEqXqKQlm1p4CoGO4xBMNwDXB-ANZI9jBp0Cv10hY","https://play-lh.googleusercontent.com/ovnjU9icYyKJdncdvOxcQclYGWSlwo5sixtBC__Y_g_SzJp15jDQSB3pDwxA8GjspbmnPZJe5Nh3sNVIIpX5dA","https://play-lh.googleusercontent.com/L7e0pPFNX6UyUKtVASf
