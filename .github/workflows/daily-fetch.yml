name: DailyPulse Daily Fetch
run-name: Daily Fetch · ${{ github.event.schedule || github.event_name }}

on:
  schedule:
    # GitHub cron 可能延迟甚至丢失单次事件，因此在北京时间 07:37–09:17
    # 使用离峰的 10 分钟滚动窗口。首个成功快照后，后续运行会在新鲜度检查处跳过。
    - cron: '37,47,57 23 * * *'
    - cron: '7,17,27,37,47,57 0 * * *'
    - cron: '7,17 1 * * *'
  # 支持在 Actions 页面手动触发
  workflow_dispatch: {}
  # 可由外部可靠调度器调用 GitHub API 触发。
  repository_dispatch:
    types: [daily-fetch]

permissions:
  contents: write

concurrency:
  group: dailypulse-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check snapshot freshness
        id: freshness
        run: node .github/scripts/check-freshness.mjs
        env:
          FORCE_FETCH: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          FRESHNESS_MAX_AGE_HOURS: '12'

      - name: Setup Node.js
        if: steps.freshness.outputs.should_fetch == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.freshness.outputs.should_fetch == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.freshness.outputs.should_fetch == 'true'
        run: npm run typecheck

      - name: Fetch data
        if: steps.freshness.outputs.should_fetch == 'true'
        run: npm run fetch
        env:
          # Product Hunt 官方 API（未配置时回退 Apify）
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
          # 仅 Product Hunt 兜底需要，其余源（App Store/Google Play/Reddit）无需
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          APIFY_PRODUCT_HUNT_ACTOR_ID: ${{ secrets.APIFY_PRODUCT_HUNT_ACTOR_ID }}
          # Reddit OAuth（推荐，CI 免代理抓 Reddit）
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Reddit 代理出口（可选）：数据中心 IP 会被 Reddit 403
          REDDIT_PROXY: ${{ secrets.REDDIT_PROXY }}
          # Bluesky 公共搜索被限流时，可用免费 App Password 认证
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          # GitHub 公共 API 未认证额度较低；可配置 PAT 提高限额
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_API_TOKEN }}
          # 可选：LibreTranslate 兼容翻译服务
          TRANSLATION_API_URL: ${{ vars.TRANSLATION_API_URL }}
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          # 未配置自托管服务时，用 MyMemory 免费匿名额度每天增量翻译少量标题。
          TRANSLATION_PROVIDER: ${{ vars.TRANSLATION_PROVIDER || 'mymemory' }}
          TRANSLATION_MAX_ITEMS_PER_RUN: ${{ vars.TRANSLATION_MAX_ITEMS_PER_RUN || '20' }}

      - name: Build site
        if: steps.freshness.outputs.should_fetch == 'true'
        run: npm run build:all

      - name: Validate production bundle
        if: steps.freshness.outputs.should_fetch == 'true'
        run: npm run validate:dist

      - name: Validate generated data
        if: steps.freshness.outputs.should_fetch == 'true'
        run: npm run validate:data
        env:
          REQUIRE_DATA_QUALITY: 'true'

      - name: Check source health
        if: steps.freshness.outputs.should_fetch == 'true'
        id: source_health
        continue-on-error: true
        run: npm run check:health
        env:
          REQUIRE_ALL_SOURCES: 'true'

      - name: Commit & push generated files
        if: steps.freshness.outputs.should_fetch == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dist
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update daily data $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push
          fi

      # 健康报告与生成数据先回写；关键来源连续超限时再令任务失败，
      # 这样 GitHub 会告警，但 workflow_run 不会部署退化快照。
      - name: Enforce source health gate
        if: steps.source_health.outcome == 'failure'
        run: exit 1

      - name: Notify external channels
        if: failure()
        continue-on-error: true
        run: npm run notify:failure
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
