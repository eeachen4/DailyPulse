name: DailyPulse Daily Fetch

on:
  schedule:
    # UTC 0:00 = 北京时间 08:00
    - cron: '0 0 * * *'
  # 支持在 Actions 页面手动触发
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dailypulse-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Fetch data
        run: npm run fetch
        env:
          # Product Hunt 官方 API（未配置时回退 Apify）
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
          # 仅 Product Hunt 兜底需要，其余源（App Store/Google Play/Reddit）无需
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          APIFY_PRODUCT_HUNT_ACTOR_ID: ${{ secrets.APIFY_PRODUCT_HUNT_ACTOR_ID }}
          # Reddit OAuth（推荐，CI 免代理抓 Reddit）
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Reddit 代理出口（可选）：数据中心 IP 会被 Reddit 403
          REDDIT_PROXY: ${{ secrets.REDDIT_PROXY }}
          # Bluesky 公共搜索被限流时，可用免费 App Password 认证
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          # GitHub 公共 API 未认证额度较低；可配置 PAT 提高限额
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_API_TOKEN }}
          # 可选：LibreTranslate 兼容翻译服务
          TRANSLATION_API_URL: ${{ vars.TRANSLATION_API_URL }}
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_MAX_ITEMS_PER_RUN: ${{ vars.TRANSLATION_MAX_ITEMS_PER_RUN }}

      - name: Build site
        run: npm run build:all

      - name: Validate generated data
        run: npm run validate:data

      - name: Check source health
        id: source_health
        continue-on-error: true
        run: npm run check:health

      - name: Commit & push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dist
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update daily data $(date -u +%Y-%m-%d)"
            git push
          fi

      # 健康报告与生成数据先回写；关键来源连续超限时再令任务失败，
      # 这样 GitHub 会告警，但 workflow_run 不会部署退化快照。
      - name: Enforce source health gate
        if: steps.source_health.outcome == 'failure'
        run: exit 1

      - name: Notify external channels
        if: failure()
        continue-on-error: true
        run: npm run notify:failure
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
