name: DailyPulse Daily Fetch

on:
  schedule:
    # UTC 0:00 = 北京时间 08:00
    - cron: '0 0 * * *'
  # 支持在 Actions 页面手动触发
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dailypulse-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Fetch data
        run: npm run fetch
        env:
          # Product Hunt 官方 API（未配置时回退 Apify）
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
          # 仅 Product Hunt 兜底需要，其余源（App Store/Google Play/Reddit）无需
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          APIFY_PRODUCT_HUNT_ACTOR_ID: ${{ secrets.APIFY_PRODUCT_HUNT_ACTOR_ID }}
          # Reddit OAuth（推荐，CI 免代理抓 Reddit）
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Reddit 代理出口（可选）：数据中心 IP 会被 Reddit 403
          REDDIT_PROXY: ${{ secrets.REDDIT_PROXY }}

      - name: Build site
        run: npm run build:all

      - name: Validate generated data
        run: npm run validate:data

      - name: Commit & push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json data/details data/history dist
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update daily data $(date -u +%Y-%m-%d)"
            git push
          fi
